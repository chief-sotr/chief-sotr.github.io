<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>commuter</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; }
    @keyframes pulse {
      0%, 100% { background: rgba(245,166,35,0.08); }
      50%       { background: rgba(245,166,35,0.18); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
    input:focus { border-color: #444 !important; outline: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ── constants ─────────────────────────────────────────────── */
    const COLORS = { B57: "#F5A623", B69: "#4A90D9" };

    const DEFAULT_CONFIG = {
      apiKey: "",
      stops: [
        { id: "", line: "B57", label: "B57 Northbound" },
        { id: "", line: "B57", label: "B57 Southbound" },
        { id: "", line: "B69", label: "B69 Northbound" },
        { id: "", line: "B69", label: "B69 Southbound" },
      ],
    };

    /* ── helpers ───────────────────────────────────────────────── */
    function minutesUntil(isoTime) {
      return Math.round((new Date(isoTime) - new Date()) / 60000);
    }

    function xmlText(el, tag) {
      return el?.getElementsByTagName(tag)?.[0]?.textContent?.trim() || null;
    }

    function parseXML(xmlString) {
      const doc = new DOMParser().parseFromString(xmlString, "application/xml");
      return Array.from(doc.getElementsByTagName("MonitoredStopVisit")).map((v) => {
        const mvj  = v.getElementsByTagName("MonitoredVehicleJourney")[0];
        const call = v.getElementsByTagName("MonitoredCall")[0];
        const dist = v.getElementsByTagName("Distances")[0];
        return {
          destination:         xmlText(mvj,  "DestinationName") || xmlText(mvj, "PublishedLineName") || "",
          expectedArrival:     xmlText(call, "ExpectedArrivalTime"),
          aimedArrival:        xmlText(call, "AimedArrivalTime"),
          presentableDistance: xmlText(dist, "PresentableDistance"),
          stopsAway:           parseInt(xmlText(dist, "StopsFromCall"), 10) || null,
        };
      });
    }

    /* ── BusCard ───────────────────────────────────────────────── */
    function BusCard({ bus, line }) {
      const color     = COLORS[line] || "#888";
      const isoTime   = bus.expectedArrival || bus.aimedArrival;
      const minutes   = isoTime ? minutesUntil(isoTime) : null;
      const isImminent = minutes !== null && minutes <= 2;

      if (minutes !== null && (minutes < 0 || minutes > 30)) return null;

      return (
        <div style={{
          display: "flex", alignItems: "center", gap: "16px",
          padding: "14px 18px",
          background: isImminent ? `${color}18` : "rgba(255,255,255,0.03)",
          borderLeft: `3px solid ${color}`,
          borderRadius: "2px 8px 8px 2px",
          marginBottom: "10px",
          animation: isImminent ? "pulse 1.5s ease-in-out infinite" : "none",
        }}>
          {/* badge */}
          <div style={{
            background: color, color: "#0a0a0a",
            fontFamily: "'DM Mono', monospace", fontWeight: 700,
            fontSize: "13px", padding: "6px 10px", borderRadius: "6px",
            minWidth: "44px", textAlign: "center", flexShrink: 0,
          }}>{line}</div>

          {/* destination + distance */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#888",
              textTransform: "uppercase", letterSpacing: "0.5px",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>→ {bus.destination}</div>
            {bus.presentableDistance && (
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#555", marginTop: "2px" }}>
                {bus.presentableDistance}
                {bus.stopsAway != null ? ` · ${bus.stopsAway} stop${bus.stopsAway !== 1 ? "s" : ""} away` : ""}
              </div>
            )}
          </div>

          {/* countdown */}
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            {minutes !== null ? (
              <>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontSize: "26px", fontWeight: 700,
                  color: isImminent ? color : "#e8e8e8", lineHeight: 1,
                }}>{minutes === 0 ? "NOW" : minutes}</div>
                {minutes > 0 && <div style={{ fontSize: "11px", color: "#555", fontFamily: "'DM Sans', sans-serif", marginTop: "2px" }}>min</div>}
              </>
            ) : (
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "13px", color: "#444" }}>–</div>
            )}
          </div>
        </div>
      );
    }

    /* ── StopSection ───────────────────────────────────────────── */
    function StopSection({ stop, apiKey, onError }) {
      const [buses,       setBuses]       = useState([]);
      const [loading,     setLoading]     = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);

      const fetchData = useCallback(async () => {
        if (!apiKey || !stop.id) return;
        setLoading(true);
        try {
          const raw = `https://bustime.mta.info/api/siri/stop-monitoring.xml`
            + `?key=${apiKey}&OperatorRef=MTA&MonitoringRef=${stop.id}`
            + `&LineRef=${encodeURIComponent("MTA NYCT_" + stop.line)}&MaximumStopVisits=10`;
          const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(raw)}`;
          const res  = await fetch(proxyUrl);
          const text = await res.text();
          setBuses(parseXML(text));
          setLastUpdated(new Date());
          onError(null);
        } catch (e) {
          onError(`${stop.label}: ${e.message}`);
        } finally {
          setLoading(false);
        }
      }, [apiKey, stop.id, stop.line, stop.label, onError]);

      useEffect(() => {
        fetchData();
        const t = setInterval(fetchData, 30000);
        return () => clearInterval(t);
      }, [fetchData]);

      const visible = buses.filter((b) => {
        const isoTime = b.expectedArrival || b.aimedArrival;
        if (!isoTime) return true;
        const m = minutesUntil(isoTime);
        return m >= 0 && m <= 30;
      });

      return (
        <div style={{ marginBottom: "28px" }}>
          {/* section header */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
            <span style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "11px", fontWeight: 600,
              color: "#555", textTransform: "uppercase", letterSpacing: "1.5px",
            }}>{stop.label}</span>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              {lastUpdated && (
                <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#333" }}>
                  {lastUpdated.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </span>
              )}
              {loading && <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#333", animation: "blink 1s ease-in-out infinite" }} />}
            </div>
          </div>

          {!stop.id ? (
            <Empty>Configure stop ID in settings</Empty>
          ) : visible.length === 0 ? (
            <Empty>{loading ? "Loading…" : "No buses within 30 min"}</Empty>
          ) : (
            visible.map((bus, i) => <BusCard key={i} bus={bus} line={stop.line} />)
          )}
        </div>
      );
    }

    function Empty({ children }) {
      return (
        <div style={{
          padding: "18px", background: "rgba(255,255,255,0.02)",
          border: "1px dashed #1e1e1e", borderRadius: "8px",
          textAlign: "center", color: "#333",
          fontFamily: "'DM Mono', monospace", fontSize: "12px",
        }}>{children}</div>
      );
    }

    /* ── Settings panel ────────────────────────────────────────── */
    const labelSt = {
      display: "block", fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
      color: "#555", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "7px",
    };
    const inputSt = {
      width: "100%", background: "#0a0a0a", border: "1px solid #2a2a2a",
      borderRadius: "6px", padding: "10px 12px", color: "#ccc",
      fontFamily: "'DM Mono', monospace", fontSize: "13px", boxSizing: "border-box",
    };

    function SettingsPanel({ config, onSave, onClose }) {
      const [draft, setDraft] = useState(JSON.parse(JSON.stringify(config)));
      const setStop = (i, field, val) => {
        const stops = [...draft.stops];
        stops[i] = { ...stops[i], [field]: val };
        setDraft({ ...draft, stops });
      };
      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.82)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 100, backdropFilter: "blur(4px)",
        }}>
          <div style={{
            background: "#111", border: "1px solid #222", borderRadius: "12px",
            padding: "32px", width: "min(500px, 92vw)", maxHeight: "90vh", overflowY: "auto",
          }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "18px", fontWeight: 700, color: "#e8e8e8", marginBottom: "24px" }}>
              ⚙ Configure Tracker
            </div>

            {/* API key */}
            <label style={{ display: "block", marginBottom: "22px" }}>
              <span style={labelSt}>MTA BusTime API Key</span>
              <input style={inputSt} type="password" placeholder="Your API key from bustime.mta.info"
                value={draft.apiKey} onChange={(e) => setDraft({ ...draft, apiKey: e.target.value })} />
              <div style={{ fontSize: "11px", color: "#444", marginTop: "6px", fontFamily: "'DM Sans', sans-serif" }}>
                Free key at <a href="https://bustime.mta.info/wiki/Developers/Index" target="_blank" rel="noreferrer" style={{ color: "#666" }}>bustime.mta.info/wiki/Developers/Index</a>
              </div>
            </label>

            {/* Stop IDs */}
            <div style={{ fontSize: "12px", color: "#555", fontFamily: "'DM Sans', sans-serif", marginBottom: "8px", textTransform: "uppercase", letterSpacing: "1px" }}>Bus Stops</div>
            <div style={{ fontSize: "11px", color: "#444", fontFamily: "'DM Sans', sans-serif", marginBottom: "16px", lineHeight: 1.6 }}>
              Find stop IDs at <a href="https://bustime.mta.info" target="_blank" rel="noreferrer" style={{ color: "#666" }}>bustime.mta.info</a> → click your stop → copy the ID from the URL (e.g. <span style={{ fontFamily: "'DM Mono', monospace" }}>308829</span>). Each direction has a different stop ID.
            </div>

            {draft.stops.map((stop, i) => (
              <div key={i} style={{ marginBottom: "14px" }}>
                <span style={labelSt}>{stop.label}</span>
                <input style={inputSt} type="text" placeholder={`Stop ID for ${stop.label}`}
                  value={stop.id} onChange={(e) => setStop(i, "id", e.target.value.trim())} />
              </div>
            ))}

            <div style={{ display: "flex", gap: "12px", marginTop: "24px" }}>
              <button onClick={() => onSave(draft)} style={{
                flex: 1, padding: "12px", background: "#F5A623", color: "#0a0a0a",
                border: "none", borderRadius: "8px", fontFamily: "'DM Sans', sans-serif",
                fontWeight: 700, fontSize: "14px", cursor: "pointer",
              }}>Save & Track</button>
              <button onClick={onClose} style={{
                padding: "12px 20px", background: "transparent", color: "#555",
                border: "1px solid #222", borderRadius: "8px",
                fontFamily: "'DM Sans', sans-serif", fontSize: "14px", cursor: "pointer",
              }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    /* ── App ───────────────────────────────────────────────────── */
    function App() {
      const [config, setConfig] = useState(() => {
        try { return JSON.parse(localStorage.getItem("mta-tracker-config")) || DEFAULT_CONFIG; }
        catch { return DEFAULT_CONFIG; }
      });
      const [showSettings, setShowSettings] = useState(!config.apiKey);
      const [error,        setError]        = useState(null);
      const [now,          setNow]          = useState(new Date());

      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 10000);
        return () => clearInterval(t);
      }, []);

      const handleSave = (cfg) => {
        setConfig(cfg);
        try { localStorage.setItem("mta-tracker-config", JSON.stringify(cfg)); } catch {}
        setShowSettings(false);
      };

      const groups = ["B57", "B69"].map((line) => ({
        line, color: COLORS[line],
        stops: config.stops.filter((s) => s.line === line),
      }));

      return (
        <>
          <div style={{
            minHeight: "100vh", background: "#080808", color: "#e8e8e8",
            fontFamily: "'DM Sans', sans-serif",
            maxWidth: "480px", margin: "0 auto", padding: "32px 20px 60px",
          }}>
            {/* header */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "36px" }}>
              <div>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#333", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "6px" }}>NYC MTA</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "28px", fontWeight: 700, color: "#e8e8e8", letterSpacing: "-0.5px", lineHeight: 1 }}>Bus Tracker</div>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#333", marginTop: "6px" }}>
                  {now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · next 30 min
                </div>
              </div>
              <button onClick={() => setShowSettings(true)} title="Settings" style={{
                background: "transparent", border: "1px solid #1e1e1e", borderRadius: "8px",
                padding: "10px 14px", cursor: "pointer", color: "#444",
                fontFamily: "'DM Mono', monospace", fontSize: "14px",
              }}>⚙</button>
            </div>

            {/* error banner */}
            {error && (
              <div style={{
                background: "rgba(255,80,80,0.08)", border: "1px solid rgba(255,80,80,0.2)",
                borderRadius: "8px", padding: "12px 16px", marginBottom: "24px",
                fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#ff5050",
              }}>{error}</div>
            )}

            {/* setup prompt */}
            {!config.apiKey && (
              <div style={{
                background: "rgba(245,166,35,0.06)", border: "1px solid rgba(245,166,35,0.15)",
                borderRadius: "8px", padding: "16px", marginBottom: "28px",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#888", lineHeight: 1.6,
              }}>
                👆 Tap <strong style={{ color: "#F5A623" }}>⚙</strong> to add your MTA API key and stop IDs to get started.
              </div>
            )}

            {/* bus groups */}
            {groups.map(({ line, color, stops }) => (
              <div key={line} style={{ marginBottom: "40px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "20px" }}>
                  <div style={{
                    background: color, color: "#0a0a0a",
                    fontFamily: "'DM Mono', monospace", fontWeight: 700,
                    fontSize: "16px", padding: "8px 16px", borderRadius: "8px",
                  }}>{line}</div>
                  <div style={{ height: "1px", flex: 1, background: `linear-gradient(to right, ${color}40, transparent)` }} />
                </div>
                {stops.map((stop, i) => (
                  <StopSection key={i} stop={stop} apiKey={config.apiKey} onError={setError} />
                ))}
              </div>
            ))}

            <div style={{
              borderTop: "1px solid #111", paddingTop: "20px",
              fontFamily: "'DM Mono', monospace", fontSize: "10px",
              color: "#2a2a2a", textAlign: "center", letterSpacing: "1px",
            }}>AUTO-REFRESHES EVERY 30 SECONDS · MTA BUSTIME API</div>
          </div>

          {showSettings && <SettingsPanel config={config} onSave={handleSave} onClose={() => setShowSettings(false)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
