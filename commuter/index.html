<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lowkey bus rider - Beta</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; }
    @keyframes pulse {
      0%, 100% { background: rgba(255,255,255,0.04); }
      50%       { background: rgba(255,255,255,0.09); }
    }
    @keyframes urgentYellow {
      0%, 100% { background: rgba(245,200,35,0.08); }
      50%       { background: rgba(245,200,35,0.22); }
    }
    @keyframes urgentRed {
      0%, 100% { background: rgba(255,60,60,0.10); }
      50%       { background: rgba(255,60,60,0.28); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    input:focus { outline: none; border-color: #444 !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* Leaflet overrides for dark theme */
    .leaflet-container { background: #111 !important; font-family: 'DM Sans', sans-serif; }
    .leaflet-control-zoom a {
      background: #1a1a1a !important; color: #aaa !important;
      border-color: #2a2a2a !important;
    }
    .leaflet-control-zoom a:hover { background: #252525 !important; color: #fff !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.6) !important; color: #333 !important; font-size: 9px;
    }
    .leaflet-control-attribution a { color: #444 !important; }
    .bus-pin-label { background: transparent; border: none; box-shadow: none; }
    /* Hide native zoom on touch devices — pinch-to-zoom is the natural gesture */
    @media (hover: none) and (pointer: coarse) {
      .leaflet-control-zoom { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ── config ──────────────────────────────────────────────── */
    const API_KEY = "5100a3c4-9704-43e4-b6d2-5d8adb10a124";
    const PROXY   = "https://mta-proxy-sundayontheroof.chief-b4a.workers.dev/?url=";

    const LINE_COLORS = {
      B57: "#F5A623", B69: "#4A90D9",
      B61: "#E05C5C", B62: "#7EC8A0", B63: "#C47FD4",
      B65: "#5BB8D4", B67: "#E8A05C", B68: "#8CA8E0",
    };
    function lineColor(line) { return LINE_COLORS[line] || "#888"; }

    /* ── helpers ─────────────────────────────────────────────── */
    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function formatDistance(meters) {
      const feet = Math.round(meters * 3.28084);
      if (feet < 528) return feet + " ft";
      return (meters * 0.000621371).toFixed(1) + " mi";
    }
    function minutesUntil(iso) {
      return Math.round((new Date(iso) - new Date()) / 60000);
    }
    function getEls(el, tag) {
      if (!el) return [];
      const byNS = el.getElementsByTagNameNS("*", tag);
      return byNS.length > 0 ? byNS : el.getElementsByTagName(tag);
    }
    function xmlText(el, tag) {
      return getEls(el, tag)?.[0]?.textContent?.trim() || null;
    }
    function parseXML(xmlString) {
      let doc = new DOMParser().parseFromString(xmlString, "text/xml");
      if (doc.querySelector("parsererror"))
        doc = new DOMParser().parseFromString(xmlString, "application/xml");

      const visits = getEls(doc, "MonitoredStopVisit");
      return Array.from(visits).map((v) => {
        const mvj  = getEls(v, "MonitoredVehicleJourney")[0];
        const call = getEls(v, "MonitoredCall")[0];
        const dist = getEls(v, "Distances")[0];
        const loc  = getEls(mvj, "VehicleLocation")[0];
        const rawLine = xmlText(mvj, "PublishedLineName") || "";
        return {
          line:                rawLine.replace(/MTA NYCT_/i, "").trim(),
          destination:         xmlText(mvj,  "DestinationName") || rawLine,
          expectedArrival:     xmlText(call, "ExpectedArrivalTime"),
          aimedArrival:        xmlText(call, "AimedArrivalTime"),
          presentableDistance: xmlText(dist, "PresentableDistance"),
          stopsAway:           parseInt(xmlText(dist, "StopsFromCall"), 10) || null,
          vehicleLat:          loc ? parseFloat(xmlText(loc, "Latitude"))  : null,
          vehicleLng:          loc ? parseFloat(xmlText(loc, "Longitude")) : null,
        };
      });
    }

    /* ── MapModal ────────────────────────────────────────────── */
    function MapModal({ bus, fleet, stopId, line, onClose }) {
      const mapRef        = useRef(null);
      const leafletRef    = useRef(null);
      const userMarker    = useRef(null);
      const stopMarker    = useRef(null); // 🚏 bus stop pin
      const fleetMarkers  = useRef([]);
      const stopCoords    = useRef(null); // { lat, lng } cached after first fetch
      const color         = lineColor(bus.line);
      const [refreshing,   setRefreshing]  = useState(false);
      const [lastRefresh,  setLastRefresh] = useState(null);
      const isRefreshing  = useRef(false); // stable guard — avoids refresh() being recreated on state change

      const GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 };

      // ── plot fleet markers (called on load + refresh) ──────────
      const plotFleet = useCallback((busArray, tappedBus) => {
        const map = leafletRef.current;
        if (!map) return;
        // Remove existing bus markers
        fleetMarkers.current.forEach(m => map.removeLayer(m));
        fleetMarkers.current = [];

        const busesWithCoords = busArray.filter(b => b.vehicleLat && b.vehicleLng);
        busesWithCoords.forEach((b) => {
          const tappedTime = tappedBus.expectedArrival || tappedBus.aimedArrival;
          const thisTime   = b.expectedArrival || b.aimedArrival;
          const isTapped   = b.line === tappedBus.line && thisTime === tappedTime;
          const pinLabel = isTapped ? "🚌" : b.line;
          const isoTime  = b.expectedArrival || b.aimedArrival;
          const mins     = isoTime ? minutesUntil(isoTime) : null;
          const timeLabel = mins === null || mins <= 0 ? "NOW" : mins + " min";
          const opacity  = isTapped ? "1" : "0.5";
          const pinSize  = isTapped ? "18px" : "11px";
          const html = '<div style="display:flex;align-items:center;justify-content:center;background:' + color + ';color:#0a0a0a;font-family:DM Mono,monospace;font-weight:700;font-size:' + pinSize + ';padding:5px 8px;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,0.7);white-space:nowrap;position:relative;opacity:' + opacity + ';">' + pinLabel + '<div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid ' + color + ';"><\/div><\/div>';
          const icon = L.divIcon({ className: "bus-pin-label", html, iconSize: [52, 32], iconAnchor: [26, 38] });
          const marker = L.marker([b.vehicleLat, b.vehicleLng], { icon })
            .addTo(map)
            .bindPopup('<b style="font-family:DM Sans,sans-serif">' + b.line + ' \u2192 ' + b.destination + '<\/b><br><span style="font-family:DM Mono,monospace;font-size:12px;color:#F5A623">' + timeLabel + '<\/span>');
          fleetMarkers.current.push(marker);
        });
      }, [color]);

      // ── refresh: re-fetch MTA and re-plot ──────────────────────
      const refresh = useCallback(async () => {
        if (isRefreshing.current) return;
        isRefreshing.current = true;
        setRefreshing(true);
        try {
          const raw = `https://bustime.mta.info/api/siri/stop-monitoring.xml`
            + `?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const res  = await fetch(PROXY + encodeURIComponent(raw));
          const text = await res.text();
          const allBuses   = parseXML(text);
          const freshFleet = allBuses.filter(b => {
            if (b.line !== line) return false;
            const iso = b.expectedArrival || b.aimedArrival;
            if (!iso) return true; // no time = approaching now, always show
            const m = minutesUntil(iso);
            return m >= -1 && m <= 30;
          });
          plotFleet(freshFleet, bus);
          setLastRefresh(new Date());
        } catch (e) {
          console.error("Map refresh failed:", e);
        } finally {
          isRefreshing.current = false;
          setRefreshing(false);
        }
      }, [stopId, line, bus, plotFleet]);

      // Center map on user location
      const centerOnUser = useCallback(() => {
        if (!leafletRef.current) return;
        navigator.geolocation.getCurrentPosition((pos) => {
          leafletRef.current.setView([pos.coords.latitude, pos.coords.longitude], 17);
          if (userMarker.current) {
            userMarker.current.setLatLng([pos.coords.latitude, pos.coords.longitude]);
          }
        }, null, GEO_OPTS);
      }, []);

      useEffect(() => {
        // Init map
        const map = L.map(mapRef.current, {
          zoomControl: true,
          attributionControl: true,
        });
        leafletRef.current = map;

        // CartoDB Dark Matter tiles
        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ).addTo(map);

        // User location pin
        const userIcon = L.divIcon({
          className: "bus-pin-label",
          html: '<div style="width:16px;height:16px;border-radius:50%;background:#4A90D9;border:3px solid #fff;box-shadow:0 0 0 3px rgba(74,144,217,0.35),0 2px 8px rgba(0,0,0,0.6);"><\/div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8],
        });


        // Default center: NYC fallback
        let defaultCenter = [40.6782, -73.9442]; // Brooklyn

        // ── fetch stop coordinates and plot 🚏 marker ──────────
        const stopIcon = L.divIcon({
          className: "bus-pin-label",
          html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));">🚏<\/div>',
          iconSize: [28, 28],
          iconAnchor: [6, 28],
        });

        // OneBusAway requires MTA_ prefix on the stop ID
        fetch(PROXY + encodeURIComponent(
          `https://bustime.mta.info/api/where/stop/MTA_${stopId}.json?key=${API_KEY}`
        ))
          .then(r => r.json())
          .then(data => {
            const lat = data?.data?.lat;
            const lng = data?.data?.lon;
            if (!lat || !lng) return;
            stopCoords.current = { lat, lng };
            stopMarker.current = L.marker([lat, lng], { icon: stopIcon })
              .addTo(map)
              .bindPopup('<span style="font-family:DM Sans,sans-serif">Stop ' + stopId + '<\/span>');
            // Re-fit bounds now that we have stop coords — fixes race condition
            // where geolocation resolved before stop fetch completed
            const points = [];
            if (userMarker.current) {
              const ul = userMarker.current.getLatLng();
              points.push([ul.lat, ul.lng]);
            }
            if (bus.vehicleLat && bus.vehicleLng) points.push([bus.vehicleLat, bus.vehicleLng]);
            points.push([lat, lng]);
            if (points.length > 1 && leafletRef.current) {
              leafletRef.current.fitBounds(L.latLngBounds(points), { padding: [80, 80], maxZoom: 17 });
            }
          })
          .catch((e) => console.warn("Stop fetch failed:", e));

        // Plot initial fleet
        plotFleet(fleet || [bus], bus);

        // Request user location, center map on it at ~1 mile zoom (z=15)
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              defaultCenter = [latitude, longitude];
              map.setView(defaultCenter, 15);
              userMarker.current = L.marker([latitude, longitude], { icon: userIcon })
                .addTo(map)
                .bindPopup('<span style="font-family:DM Sans,sans-serif">You are here<\/span>');

              // Fit view: user + tapped bus + stop (whichever coords are available)
              const points = [[latitude, longitude]];
              if (bus.vehicleLat && bus.vehicleLng) points.push([bus.vehicleLat, bus.vehicleLng]);
              if (stopCoords.current) points.push([stopCoords.current.lat, stopCoords.current.lng]);
              if (points.length > 1) {
                map.fitBounds(L.latLngBounds(points), { padding: [80, 80], maxZoom: 17 });
              }
            },
            () => {
              // Geolocation denied or failed — center on bus or Brooklyn
              if (bus.vehicleLat && bus.vehicleLng) {
                map.setView([bus.vehicleLat, bus.vehicleLng], 15);
              } else {
                map.setView(defaultCenter, 14);
              }
            },
            GEO_OPTS
          );
        } else {
          map.setView(defaultCenter, 14);
        }

        // Close on Escape
        const handleKey = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handleKey);

        return () => {
          map.remove();
          window.removeEventListener("keydown", handleKey);
        };
      }, []);

      const isoTime   = bus.expectedArrival || bus.aimedArrival;
      const minutes   = isoTime ? minutesUntil(isoTime) : null;
      const timeLabel = minutes === null || minutes <= 0 ? "NOW" : `${minutes} min`;
      const isImminent = minutes === null || minutes <= 2;
      const isRedAlert    = minutes !== null && minutes < 5;
      const isYellowAlert = minutes !== null && minutes >= 5 && minutes <= 10;
      const etaColor = isRedAlert ? "#ff3c3c" : isYellowAlert ? "#f5c823" : isImminent ? color : "#e8e8e8";
      const noGPS = (fleet || [bus]).filter(b => b.vehicleLat && b.vehicleLng).length === 0;

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 1000,
          animation: "modalIn 0.2s ease",
        }}>
          {/* Full-screen map */}
          <div ref={mapRef} style={{ position: "absolute", inset: 0 }} />

          {/* ── Bottom-right: recenter + refresh — sit above the card ── */}
          <div style={{
            position: "absolute", bottom: 100, right: "16px", zIndex: 1002,
            display: "flex", flexDirection: "column", gap: "8px",
          }}>
            <button onClick={centerOnUser} title="Center on my location" style={{
              width: "44px", height: "44px",
              background: "rgba(13,13,13,0.92)", border: "1px solid #2a2a2a",
              borderRadius: "50%", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A90D9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
              </svg>
            </button>
            <button onClick={refresh} title="Refresh bus locations" style={{
              width: "44px", height: "44px",
              background: "rgba(13,13,13,0.92)", border: "1px solid #2a2a2a",
              borderRadius: "50%", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={refreshing ? "#555" : "#7EC8A0"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: refreshing ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.5s ease" }}>
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
          </div>

          {/* ── Floating info card ── */}
          <div style={{
            position: "absolute",
            bottom: "calc(16px + env(safe-area-inset-bottom, 0px))",
            left: "16px", right: "16px",
            zIndex: 1001,
            background: "#0f0f0f",
            border: "1px solid rgba(255,255,255,0.08)",
            boxShadow: "inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.72)",
            borderRadius: "18px",
          }}>
            <div style={{
              display: "flex", alignItems: "center", gap: "14px",
              padding: "16px 18px",
            }}>
              {/* Line badge */}
              <div style={{
                background: color, color: "#0a0a0a",
                fontFamily: "'DM Mono', monospace", fontWeight: 700,
                fontSize: "14px", padding: "8px 12px", borderRadius: "8px",
                flexShrink: 0, letterSpacing: "0.3px",
              }}>{bus.line}</div>

              {/* Destination + status */}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontFamily: "'DM Sans', sans-serif", fontSize: "14px",
                  color: "#ccc", textTransform: "uppercase", letterSpacing: "0.4px",
                  whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                }}>→ {bus.destination}</div>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontSize: "10px",
                  color: "#444", marginTop: "3px",
                }}>
                  {bus.presentableDistance || ""}
                  {lastRefresh && (
                    <span style={{ color: "#2e2e2e" }}>
                      {bus.presentableDistance ? " · " : ""}updated {lastRefresh.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                    </span>
                  )}
                </div>
              </div>

              {/* ETA */}
              <div style={{ textAlign: "right", flexShrink: 0, minWidth: "48px" }}>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "28px", lineHeight: 1, color: etaColor,
                }}>{minutes !== null ? (minutes <= 0 ? "NOW" : minutes) : "NOW"}</div>
                {minutes !== null && minutes > 0 && (
                  <div style={{ fontSize: "10px", color: "#444", fontFamily: "'DM Sans', sans-serif", marginTop: "2px" }}>min</div>
                )}
              </div>

              {/* Close */}
              <button onClick={onClose} style={{
                flexShrink: 0, width: "44px", height: "44px",
                background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
                borderRadius: "50%", cursor: "pointer", color: "#555",
                fontSize: "20px", display: "flex", alignItems: "center",
                justifyContent: "center", fontFamily: "'DM Mono', monospace",
              }}>×</button>
            </div>
          </div>
        </div>
      );
    }

    /* ── parse scheduled timetable XML ──────────────────────── */
    function parseTimetableXML(xmlString) {
      let doc = new DOMParser().parseFromString(xmlString, "text/xml");
      if (doc.querySelector("parsererror"))
        doc = new DOMParser().parseFromString(xmlString, "application/xml");
      const visits = getEls(doc, "TimetabledStopVisit");
      return Array.from(visits).map((v) => {
        const mvj  = getEls(v, "MonitoredVehicleJourney")[0];
        const call = getEls(v, "MonitoredCall")[0];
        const rawLine = xmlText(mvj, "PublishedLineName") || "";
        return {
          line:        rawLine.replace(/MTA NYCT_/i, "").trim(),
          destination: xmlText(mvj, "DestinationName") || rawLine,
          aimedArrival: xmlText(call, "AimedArrivalTime"),
          expectedArrival: null,
          presentableDistance: null,
          stopsAway: null,
          vehicleLat: null,
          vehicleLng: null,
          isScheduled: true,
        };
      });
    }
    function BusRow({ bus, onOpenMap }) {
      const color      = lineColor(bus.line);
      const isoTime    = bus.expectedArrival || bus.aimedArrival;
      const minutes    = isoTime ? minutesUntil(isoTime) : null;
      const isImminent = minutes === null || minutes <= 2;

      // Urgency levels
      const isRedAlert    = minutes !== null && minutes < 5;
      const isYellowAlert = minutes !== null && minutes >= 5 && minutes <= 10;

      const bgStyle = isRedAlert
        ? { animation: "urgentRed 0.8s ease-in-out infinite" }
        : isYellowAlert
        ? { animation: "urgentYellow 1.2s ease-in-out infinite" }
        : isImminent
        ? { animation: "pulse 1.5s ease-in-out infinite" }
        : { background: "rgba(255,255,255,0.025)", animation: "fadeIn 0.25s ease" };

      const borderColor = isRedAlert ? "#ff3c3c" : isYellowAlert ? "#f5c823" : color;

      return (
        <div
          onClick={() => onOpenMap(bus)}
          style={{
            display: "flex", alignItems: "center", gap: "14px",
            padding: "13px 16px",
            ...bgStyle,
            borderLeft: `3px solid ${borderColor}`,
            borderRadius: "2px 8px 8px 2px",
            marginBottom: "8px",
            cursor: "pointer",
            transition: "border-color 0.3s ease",
          }}
          onMouseEnter={(e) => e.currentTarget.style.filter = "brightness(1.15)"}
          onMouseLeave={(e) => e.currentTarget.style.filter = "brightness(1)"}
        >
          {/* line badge */}
          <div style={{
            background: color, color: "#0a0a0a",
            fontFamily: "'DM Mono', monospace", fontWeight: 700,
            fontSize: "12px", padding: "5px 9px", borderRadius: "5px",
            minWidth: "42px", textAlign: "center", flexShrink: 0, letterSpacing: "0.3px",
          }}>{bus.line || "?"}</div>

          {/* destination + distance */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#999",
              textTransform: "uppercase", letterSpacing: "0.4px",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>→ {bus.destination}</div>
            {bus.presentableDistance && (
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#444", marginTop: "2px" }}>
                {bus.presentableDistance}{bus.stopsAway != null && !bus.presentableDistance?.toLowerCase().includes("stop") ? ` · ${bus.stopsAway} stop${bus.stopsAway !== 1 ? "s" : ""} away` : ""}
              </div>
            )}
          </div>

          {/* countdown + map hint */}
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            {minutes !== null ? (
              <>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "24px", lineHeight: 1,
                  color: isRedAlert ? "#ff3c3c" : isYellowAlert ? "#f5c823" : isImminent ? color : "#e8e8e8",
                }}>{minutes <= 0 ? "NOW" : minutes}</div>
                {minutes > 0 && <div style={{ fontSize: "10px", color: "#444", fontFamily: "'DM Sans', sans-serif", marginTop: "2px" }}>min</div>}
              </>
            ) : (
              <div style={{
                fontFamily: "'DM Mono', monospace", fontWeight: 700,
                fontSize: "24px", lineHeight: 1, color,
              }}>NOW</div>
            )}
            <div style={{ fontSize: "9px", color: "#2e2e2e", fontFamily: "'DM Mono', monospace", marginTop: "4px", letterSpacing: "0.5px" }}></div>
          </div>
        </div>
      );
    }

    /* ── ScheduledBusRow ─────────────────────────────────────── */
    function ScheduledBusRow({ bus }) {
      const isoTime = bus.aimedArrival;
      const minutes = isoTime ? minutesUntil(isoTime) : null;
      if (minutes !== null && (minutes < -1 || minutes > 30)) return null;

      return (
        <div style={{
          display: "flex", alignItems: "center", gap: "14px",
          padding: "13px 16px",
          background: "rgba(255,255,255,0.012)",
          borderLeft: "3px solid #2a2a2a",
          borderRadius: "2px 8px 8px 2px",
          marginBottom: "8px",
          opacity: 0.7,
        }}>
          {/* muted line badge */}
          <div style={{
            background: "#1e1e1e", color: "#444",
            fontFamily: "'DM Mono', monospace", fontWeight: 700,
            fontSize: "12px", padding: "5px 9px", borderRadius: "5px",
            minWidth: "42px", textAlign: "center", flexShrink: 0, letterSpacing: "0.3px",
            border: "1px solid #2a2a2a",
          }}>{bus.line || "?"}</div>

          {/* destination + offline badge */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#555",
              textTransform: "uppercase", letterSpacing: "0.4px",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>→ {bus.destination}</div>
            <div style={{
              display: "inline-flex", alignItems: "center", gap: "4px",
              marginTop: "4px",
              background: "rgba(255,255,255,0.04)", border: "1px solid #2a2a2a",
              borderRadius: "4px", padding: "2px 7px",
            }}>
              {/* offline clock icon */}
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "9px", color: "#444", letterSpacing: "1px", textTransform: "uppercase" }}>scheduled</span>
            </div>
          </div>

          {/* countdown */}
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            {minutes !== null ? (
              <>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "24px", lineHeight: 1, color: "#3a3a3a",
                }}>{minutes <= 0 ? "NOW" : minutes}</div>
                {minutes > 0 && <div style={{ fontSize: "10px", color: "#333", fontFamily: "'DM Sans', sans-serif", marginTop: "2px" }}>min</div>}
              </>
            ) : (
              <div style={{ fontFamily: "'DM Mono', monospace", fontWeight: 700, fontSize: "24px", lineHeight: 1, color: "#3a3a3a" }}>–</div>
            )}
          </div>
        </div>
      );
    }

    /* ── StopPanel ───────────────────────────────────────────── */
    function StopPanel({ stopId, label, onRemove, onOpenMap, onDataUpdated }) {
      const [buses,       setBuses]       = useState([]);
      const [loading,     setLoading]     = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [fetchError,  setFetchError]  = useState(null);

      const fetchData = useCallback(async () => {
        if (!stopId) return;
        setLoading(true);
        setFetchError(null);
        try {
          // Fetch real-time and timetable in parallel
          const realtimeRaw   = `https://bustime.mta.info/api/siri/stop-monitoring.xml?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const timetableRaw  = `https://bustime.mta.info/api/siri/stop-timetable.xml?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;

          const [rtRes, ttRes] = await Promise.all([
            fetch(PROXY + encodeURIComponent(realtimeRaw)),
            fetch(PROXY + encodeURIComponent(timetableRaw)),
          ]);
          const [rtText, ttText] = await Promise.all([rtRes.text(), ttRes.text()]);

          const realtime  = parseXML(rtText);
          const scheduled = parseTimetableXML(ttText);

          // Merge: drop scheduled entries that already have a real-time match
          // Match = same line + aimed arrival within 3 minutes of a real-time entry
          const unmatched = scheduled.filter((s) => {
            if (!s.aimedArrival) return false;
            const sTime = new Date(s.aimedArrival).getTime();
            return !realtime.some((r) => {
              if (r.line !== s.line) return false;
              const rTime = new Date(r.expectedArrival || r.aimedArrival || 0).getTime();
              return Math.abs(sTime - rTime) <= 3 * 60 * 1000; // 3 min tolerance
            });
          });

          setBuses([...realtime, ...unmatched]);
          const updated = new Date();
          setLastUpdated(updated);
          onDataUpdated?.(updated);
        } catch (e) {
          setFetchError(e.message);
        } finally {
          setLoading(false);
        }
      }, [stopId]);

      useEffect(() => {
        fetchData();
        const t = setInterval(fetchData, 30000);
        return () => clearInterval(t);
      }, [fetchData]);

      const visible = buses
        .filter((b) => {
          const iso = b.expectedArrival || b.aimedArrival;
          if (!iso) return true;
          const m = minutesUntil(iso);
          return m >= -1 && m <= 30;
        })
        .sort((a, b) => {
          const tA = new Date(a.expectedArrival || a.aimedArrival || 0).getTime();
          const tB = new Date(b.expectedArrival || b.aimedArrival || 0).getTime();
          return tA - tB;
        });

      return (
        <div style={{ marginBottom: "28px", animation: "fadeIn 0.3s ease" }}>
          {/* stop header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "13px", color: "#e8e8e8", fontWeight: 600 }}>
                Stop <span style={{ color: "#F5A623" }}>{stopId}</span>
              </div>
              {label && (
                <div style={{
                  fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
                  color: "#444", textTransform: "uppercase", letterSpacing: "0.8px",
                }}>{label}</div>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              {loading && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#333", animation: "blink 1s ease-in-out infinite" }} />}
              <button onClick={onRemove} title="Remove stop" style={{
                background: "transparent", border: "none", cursor: "pointer",
                color: "#2e2e2e", fontSize: "18px", lineHeight: 1,
                padding: "2px 4px", fontFamily: "'DM Mono', monospace",
              }}>×</button>
            </div>
          </div>

          <div style={{ height: "1px", background: "linear-gradient(to right, #1e1e1e, transparent)", marginBottom: "12px" }} />

          {fetchError ? (
            <div style={{
              padding: "14px", background: "rgba(255,80,80,0.06)",
              border: "1px solid rgba(255,80,80,0.15)", borderRadius: "8px",
              fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#ff5050",
            }}>Error: {fetchError}</div>
          ) : visible.length === 0 ? (
            <div style={{
              padding: "18px", background: "rgba(255,255,255,0.02)",
              border: "1px dashed #1a1a1a", borderRadius: "8px",
              textAlign: "center", color: "#2e2e2e",
              fontFamily: "'DM Mono', monospace", fontSize: "12px",
            }}>{loading ? "Loading…" : "No buses within 30 min"}</div>
          ) : (
            visible.map((bus, i) => (
              bus.isScheduled
                ? <ScheduledBusRow key={i} bus={bus} />
                : <BusRow key={i} bus={bus} onOpenMap={(tapped) => onOpenMap(tapped, visible.filter(b => b.line === tapped.line), stopId, tapped.line)} />
            ))
          )}
        </div>
      );
    }

    /* ── AddStopTrigger ───────────────────────────────────────── */
    function AddStopTrigger({ onClick, hasStops }) {
      return (
        <button
          type="button"
          onClick={onClick}
          style={{
            width: "100%",
            border: "1px dashed " + (hasStops ? "#2a2a2a" : "#3a3a3a"),
            borderRadius: "10px",
            padding: "18px",
            background: "transparent",
            color: hasStops ? "#444" : "#555",
            fontFamily: "'DM Sans', sans-serif",
            fontSize: "14px",
            cursor: "pointer",
            marginBottom: "32px",
          }}
        >
          + Add Stop
        </button>
      );
    }

    /* ── AddStopModal ─────────────────────────────────────────── */
    function AddStopModal({ onAdd, onClose }) {
      const [tab, setTab] = useState("enterId");
      const [id, setId] = useState("");
      const [label, setLabel] = useState("");
      const inputRef = useRef();
      const [userCoords, setUserCoords] = useState(null);
      const [nearbyStops, setNearbyStops] = useState([]);
      const [nearbyLoading, setNearbyLoading] = useState(false);
      const [nearbyError, setNearbyError] = useState(null);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const nearbyFetched = useRef(false);

      const close = useCallback(() => {
        nearbyFetched.current = false;
        setTab("enterId");
        setId("");
        setLabel("");
        setUserCoords(null);
        setNearbyStops([]);
        setNearbyError(null);
        setSelectedIds(new Set());
        onClose();
      }, [onClose]);

      useEffect(() => {
        const handleKey = (e) => { if (e.key === "Escape") close(); };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [close]);

      const submitEnterId = () => {
        const trimmed = id.trim();
        if (!trimmed) return;
        onAdd({ id: trimmed.replace(/^MTA_/i, ""), label: label.trim() });
        close();
      };

      const fetchNearby = useCallback(async () => {
        if (nearbyFetched.current) return;
        nearbyFetched.current = true;
        setNearbyError(null);
        setNearbyStops([]);
        if (!navigator.geolocation) {
          setNearbyError("Location unavailable — use the Enter ID tab instead");
          setNearbyLoading(false);
          return;
        }
        setNearbyLoading(true);
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
          });
          const { latitude, longitude } = pos.coords;
          setUserCoords({ lat: latitude, lon: longitude });
          const url = `https://bustime.mta.info/api/where/stops-for-location.json?key=${API_KEY}&lat=${latitude}&lon=${longitude}&radius=400`;
          const res = await fetch(PROXY + encodeURIComponent(url));
          const data = await res.json();
          const list = data?.data?.list || [];
          const refs = data?.data?.references || {};
          const withDistance = list.map((s) => {
            const routeIds = s.routeIds || [];
            const routes = (refs.routes || []).filter((r) => routeIds.includes(r.id));
            const shortNames = routes.map((r) => r.shortName || r.id).filter(Boolean);
            const meters = distanceMeters(latitude, longitude, s.lat, s.lon);
            return {
              ...s,
              idClean: (s.code != null ? String(s.code) : (s.id || "").replace(/^MTA_/i, "")),
              routeShortNames: shortNames,
              distanceM: meters,
            };
          });
          withDistance.sort((a, b) => a.distanceM - b.distanceM);
          setNearbyStops(withDistance.slice(0, 8));
        } catch (e) {
          setNearbyError(e.message || "Could not load nearby stops. Use the Enter ID tab instead.");
        } finally {
          setNearbyLoading(false);
        }
      }, []);

      const onTabNearby = () => {
        setTab("nearby");
        fetchNearby();
      };

      const toggleStop = (stop) => {
        const idClean = stop.idClean || (stop.id || "").replace(/^MTA_/i, "");
        setSelectedIds((prev) => {
          const next = new Set(prev);
          if (next.has(idClean)) next.delete(idClean);
          else if (next.size < 4) next.add(idClean);
          return next;
        });
        setLabel(stop.name || "");
      };

      const addSelectedStops = () => {
        const toAdd = nearbyStops.filter((s) => selectedIds.has(s.idClean || (s.id || "").replace(/^MTA_/i, "")));
        toAdd.forEach((s) => onAdd({ id: s.idClean || s.id, label: s.name || "" }));
        close();
      };

      const cardContent = (
        <div
          style={{
            background: "#0d0d0d",
            border: "1px solid #1a1a1a",
            borderRadius: "12px",
            maxWidth: "420px",
            width: "100%",
            maxHeight: "90vh",
            overflow: "hidden",
            display: "flex",
            flexDirection: "column",
            boxShadow: "0 8px 32px rgba(0,0,0,0.6)",
          }}
          onClick={(e) => e.stopPropagation()}
        >
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 18px", borderBottom: "1px solid #1a1a1a" }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "16px", fontWeight: 700, color: "#e8e8e8" }}>Add stop</div>
            <button onClick={close} style={{
              background: "none", border: "none", color: "#555", fontSize: "22px", cursor: "pointer",
              padding: "0 4px", lineHeight: 1, fontFamily: "'DM Mono', monospace",
            }}>×</button>
          </div>
          <div style={{ display: "flex", borderBottom: "1px solid #1a1a1a" }}>
            <button
              type="button"
              onClick={() => setTab("enterId")}
              style={{
                flex: 1, padding: "12px 16px", background: "none", border: "none",
                borderBottom: tab === "enterId" ? "2px solid #F5A623" : "2px solid transparent",
                color: tab === "enterId" ? "#e8e8e8" : "#555",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", fontWeight: 600, cursor: "pointer",
              }}
            >
              Enter ID
            </button>
            <button
              type="button"
              onClick={onTabNearby}
              style={{
                flex: 1, padding: "12px 16px", background: "none", border: "none",
                borderBottom: tab === "nearby" ? "2px solid #F5A623" : "2px solid transparent",
                color: tab === "nearby" ? "#e8e8e8" : "#555",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", fontWeight: 600, cursor: "pointer",
              }}
            >
              Nearby
            </button>
          </div>
          <div style={{ padding: "18px", overflowY: "auto", flex: 1 }}>
            {tab === "enterId" && (
              <>
                <input
                  ref={inputRef}
                  type="text"
                  placeholder="Stop ID (e.g. 308829)"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitEnterId()}
                  style={{
                    width: "100%", background: "#0a0a0a", border: "1px solid #1a1a1a",
                    borderRadius: "8px", padding: "12px 14px", color: "#e8e8e8",
                    fontFamily: "'DM Mono', monospace", fontSize: "14px", marginBottom: "12px",
                  }}
                />
                <input
                  type="text"
                  placeholder="e.g. Northbound on Court St"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitEnterId()}
                  style={{
                    width: "100%", background: "#0a0a0a", border: "1px solid #1a1a1a",
                    borderRadius: "8px", padding: "12px 14px", color: "#e8e8e8",
                    fontFamily: "'DM Sans', sans-serif", fontSize: "14px", marginBottom: "12px",
                  }}
                />
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#555", marginBottom: "16px", lineHeight: 1.5 }}>
                  Find stop IDs at{" "}
                  <a href="https://bustime.mta.info" target="_blank" rel="noreferrer" style={{ color: "#666", textDecoration: "underline" }}>bustime.mta.info</a>
                  {" "}→ click your stop → copy the ID from the URL.
                </div>
                <button onClick={submitEnterId} style={{
                  width: "100%", padding: "12px 18px", background: "#F5A623", color: "#0a0a0a",
                  border: "none", borderRadius: "8px", fontFamily: "'DM Sans', sans-serif",
                  fontWeight: 700, fontSize: "14px", cursor: "pointer",
                }}>
                  Add Stop
                </button>
              </>
            )}
            {tab === "nearby" && (
              <>
                {nearbyLoading && (
                  <div style={{ padding: "24px 0", color: "#555", fontFamily: "'DM Sans', sans-serif", fontSize: "14px" }}>
                    Locating you…
                  </div>
                )}
                {!nearbyLoading && nearbyError && (
                  <div style={{
                    padding: "12px", background: "rgba(255,80,80,0.08)", border: "1px solid rgba(255,80,80,0.2)",
                    borderRadius: "8px", fontFamily: "'DM Sans', sans-serif", fontSize: "12px", color: "#ff6060", marginBottom: "12px",
                  }}>
                    {nearbyError}
                  </div>
                )}
                {!nearbyLoading && !nearbyError && nearbyStops.length > 0 && (
                  <>
                    <div style={{ maxHeight: "55vh", overflowY: "auto", marginBottom: "16px" }}>
                      {nearbyStops.map((stop) => {
                        const idClean = stop.idClean || (stop.id || "").replace(/^MTA_/i, "");
                        const selected = selectedIds.has(idClean);
                        return (
                          <div
                            key={stop.id || idClean}
                            role="button"
                            tabIndex={0}
                            onClick={() => toggleStop(stop)}
                            onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleStop(stop); } }}
                            style={{
                              display: "flex", alignItems: "center", gap: "12px",
                              padding: "12px 14px",
                              borderLeft: "3px solid " + (selected ? "#F5A623" : "transparent"),
                              background: selected ? "rgba(245,166,35,0.06)" : "transparent",
                              borderRadius: "4px", marginBottom: "8px", cursor: "pointer",
                              border: "1px solid #1a1a1a",
                            }}
                          >
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#e8e8e8", marginBottom: "4px" }}>{stop.name || "Stop " + idClean}</div>
                              <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                                {(stop.routeShortNames || []).map((sn) => (
                                  <span key={sn} style={{
                                    background: lineColor(sn), color: "#0a0a0a",
                                    fontFamily: "'DM Mono', monospace", fontWeight: 700, fontSize: "10px",
                                    padding: "2px 6px", borderRadius: "4px",
                                  }}>{sn}</span>
                                ))}
                                <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#555" }}>{formatDistance(stop.distanceM)}</span>
                              </div>
                            </div>
                            {selected && (
                              <span style={{ color: "#F5A623", fontSize: "18px" }}>✓</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    <button
                      onClick={addSelectedStops}
                      disabled={selectedIds.size === 0}
                      style={{
                        width: "100%", padding: "12px 18px", background: selectedIds.size > 0 ? "#F5A623" : "#2a2a2a",
                        color: selectedIds.size > 0 ? "#0a0a0a" : "#555", border: "none", borderRadius: "8px",
                        fontFamily: "'DM Sans', sans-serif", fontWeight: 700, fontSize: "14px", cursor: selectedIds.size > 0 ? "pointer" : "default",
                      }}
                    >
                      Add Stop{selectedIds.size !== 1 ? "s" : ""}
                    </button>
                  </>
                )}
                {!nearbyLoading && !nearbyError && nearbyStops.length === 0 && userCoords && (
                  <div style={{ color: "#555", fontFamily: "'DM Sans', sans-serif", fontSize: "13px" }}>No stops found within 400 m.</div>
                )}
              </>
            )}
          </div>
        </div>
      );

      return (
        <div
          style={{
            position: "fixed", inset: 0, zIndex: 1000,
            background: "rgba(0,0,0,0.7)",
            display: "flex", alignItems: "center", justifyContent: "center",
            padding: "20px",
            animation: "modalIn 0.2s ease",
          }}
          onClick={close}
        >
          {cardContent}
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [stops, setStops] = useState(() => {
        try { return JSON.parse(localStorage.getItem("mta-stops")) || []; }
        catch { return []; }
      });
      const [dataLastUpdated, setDataLastUpdated] = useState(null);
      const [mapData, setMapData] = useState(null); // { bus, fleet, stopId, line }
      const [addModalOpen, setAddModalOpen] = useState(false);

      const saveStops  = (u) => { setStops(u); try { localStorage.setItem("mta-stops", JSON.stringify(u)); } catch {} };
      const addStop    = (s) => setStops((prev) => { const next = [...prev, s]; try { localStorage.setItem("mta-stops", JSON.stringify(next)); } catch {} return next; });
      const removeStop = (i) => saveStops(stops.filter((_, idx) => idx !== i));

      return (
        <div style={{
          minHeight: "100vh", background: "#080808", color: "#e8e8e8",
          fontFamily: "'DM Sans', sans-serif",
          maxWidth: "480px", margin: "0 auto", padding: "32px 20px 60px",
        }}>
          {/* header */}
          <div style={{ marginBottom: "32px" }}>
            <div style={{
              fontFamily: "'DM Mono', monospace", fontSize: "10px",
              color: "#555", letterSpacing: "2.5px", textTransform: "uppercase", marginBottom: "6px",
            }}>NYC MTA</div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "28px", fontWeight: 700,
              color: "#e8e8e8", letterSpacing: "-0.5px", lineHeight: 1,
            }}>lowkey bus rider</div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#555", marginTop: "6px" }}>
              beta · last updated {dataLastUpdated ? dataLastUpdated.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—"} · next 30 min
            </div>
          </div>

          <AddStopTrigger onClick={() => setAddModalOpen(true)} hasStops={stops.length > 0} />

          {addModalOpen && <AddStopModal onAdd={addStop} onClose={() => setAddModalOpen(false)} />}

          {stops.length === 0 ? (
            <div style={{
              padding: "32px 20px", textAlign: "center",
              fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#222", lineHeight: 2,
            }}>
              No stops added yet.<br />Click &quot;+ Add Stop&quot; to get started.
            </div>
          ) : (
            stops.map((stop, i) => (
              <StopPanel
                key={stop.id + i}
                stopId={stop.id}
                label={stop.label}
                onRemove={() => removeStop(i)}
                onOpenMap={(bus, fleet, stopId, line) => setMapData({ bus, fleet, stopId, line })}
                onDataUpdated={(d) => setDataLastUpdated(d)}
              />
            ))
          )}

          <div style={{
            borderTop: "1px solid #111", paddingTop: "20px", marginTop: "12px",
            fontFamily: "'DM Mono', monospace", fontSize: "10px",
            color: "#555", textAlign: "center", letterSpacing: "1px",
          }}>AUTO-REFRESHES EVERY 30 SECONDS · MTA BUSTIME API · v1.4.0</div>

          {/* Map modal */}
          {mapData && <MapModal bus={mapData.bus} fleet={mapData.fleet} stopId={mapData.stopId} line={mapData.line} onClose={() => setMapData(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
