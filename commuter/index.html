<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ── config ──────────────────────────────────────────────── */
    const APP_VERSION = "2.1.0"; // Semver: bump PATCH for fixes, MINOR for features, MAJOR for breaking changes
    const API_KEY = "5100a3c4-9704-43e4-b6d2-5d8adb10a124";
    const PROXY   = "https://mta-proxy-sundayontheroof.chief-b4a.workers.dev/?url=";

    const LINE_COLORS = {
      B57: "#F5A623", B69: "#4A90D9",
      B61: "#E05C5C", B62: "#7EC8A0", B63: "#C47FD4",
      B65: "#5BB8D4", B67: "#E8A05C", B68: "#8CA8E0",
    };
    function lineColor(line) { return LINE_COLORS[line] || "#888"; }

    const THEMES = {
      default:   { label: "Default",   mapTiles: "dark"  },
      parchment: { label: "Parchment", mapTiles: "light" },
      lavender:  { label: "Lavender",  mapTiles: "light" },
      slate:     { label: "Slate",     mapTiles: "dark"  },
    };
    const TILE_URLS = {
      dark:  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      light: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    };

    function badgeStyle() {
      return {
        fontFamily: "'DM Mono', monospace",
        fontWeight: 700,
        fontSize: "15px",
        letterSpacing: "0.3px",
      };
    }

    /* ── helpers ─────────────────────────────────────────────── */
    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function formatDistance(meters) {
      const feet = Math.round(meters * 3.28084);
      if (feet < 528) return feet + " ft";
      return (meters * 0.000621371).toFixed(1) + " mi";
    }
    function formatDistanceNearby(meters) {
      const feet = Math.round(meters * 3.28084);
      if (feet < 1000) return feet + " ft";
      return (meters * 0.000621371).toFixed(1) + " mi";
    }
    function toTitleCase(str) {
      if (!str || typeof str !== "string") return "";
      return str.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
    }
    function inferDirection(stopName) {
      if (!stopName || typeof stopName !== "string") return "—";
      const n = stopName.toUpperCase();
      if (/\bNB\b|NORTHBOUND|NORTH\b/.test(n)) return "→ Northbound";
      if (/\bSB\b|SOUTHBOUND|SOUTH\b/.test(n)) return "→ Southbound";
      if (/\bEB\b|EASTBOUND|EAST\b/.test(n)) return "→ Eastbound";
      if (/\bWB\b|WESTBOUND|WEST\b/.test(n)) return "→ Westbound";
      return "→ " + (stopName.length > 28 ? stopName.slice(0, 25) + "…" : stopName);
    }
    function minutesUntil(iso) {
      return Math.round((new Date(iso) - new Date()) / 60000);
    }
    function getEls(el, tag) {
      if (!el) return [];
      const byNS = el.getElementsByTagNameNS("*", tag);
      return byNS.length > 0 ? byNS : el.getElementsByTagName(tag);
    }
    function xmlText(el, tag) {
      return getEls(el, tag)?.[0]?.textContent?.trim() || null;
    }
    function parseXML(xmlString) {
      let doc = new DOMParser().parseFromString(xmlString, "text/xml");
      if (doc.querySelector("parsererror"))
        doc = new DOMParser().parseFromString(xmlString, "application/xml");

      const visits = getEls(doc, "MonitoredStopVisit");
      return Array.from(visits).map((v) => {
        const mvj  = getEls(v, "MonitoredVehicleJourney")[0];
        const call = getEls(v, "MonitoredCall")[0];
        const dist = getEls(v, "Distances")[0];
        const loc  = getEls(mvj, "VehicleLocation")[0];
        const rawLine = xmlText(mvj, "PublishedLineName") || "";
        return {
          line:                rawLine.replace(/MTA NYCT_/i, "").trim(),
          destination:         xmlText(mvj,  "DestinationName") || rawLine,
          expectedArrival:     xmlText(call, "ExpectedArrivalTime"),
          aimedArrival:        xmlText(call, "AimedArrivalTime"),
          presentableDistance: xmlText(dist, "PresentableDistance"),
          stopsAway:           parseInt(xmlText(dist, "StopsFromCall"), 10) || null,
          vehicleLat:          loc ? parseFloat(xmlText(loc, "Latitude"))  : null,
          vehicleLng:          loc ? parseFloat(xmlText(loc, "Longitude")) : null,
          shapeRef:            xmlText(mvj, "JourneyPatternRef") || null,
        };
      });
    }

    /* ── Route shape utilities ──────────────────────────────── */
    function decodePolyline(encoded) {
      const points = [];
      let index = 0, lat = 0, lng = 0;
      while (index < encoded.length) {
        let shift = 0, result = 0, b;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : result >> 1;
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : result >> 1;
        points.push([lat / 1e5, lng / 1e5]);
      }
      return points;
    }

    function closestPointIndex(points, lat, lng) {
      let minDist = Infinity, minIdx = 0;
      points.forEach(([pLat, pLng], i) => {
        const d = Math.pow(pLat - lat, 2) + Math.pow(pLng - lng, 2);
        if (d < minDist) { minDist = d; minIdx = i; }
      });
      return minIdx;
    }

    /* ── MapModal ────────────────────────────────────────────── */
    function MapModal({ bus, fleet, stopId, line, theme, onClose }) {
      const mapRef        = useRef(null);
      const leafletRef    = useRef(null);
      const userMarker    = useRef(null);
      const stopMarker    = useRef(null); // 🚏 bus stop pin
      const fleetMarkers  = useRef([]);
      const stopCoords    = useRef(null); // { lat, lng } cached after first fetch
      const routeLayersRef = useRef([]); // [ghostLayer, activeSegmentLayer]
      const routePointsRef = useRef(null); // decoded polyline points
      const color         = lineColor(bus.line);
      const [refreshing,   setRefreshing]  = useState(false);
      const [lastRefresh,  setLastRefresh] = useState(null);
      const isRefreshing  = useRef(false); // stable guard — avoids refresh() being recreated on state change

      const GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 };

      // ── draw active segment polyline (bus → stop) ──────────
      const drawActiveSegment = useCallback((busLat, busLng) => {
        const map = leafletRef.current;
        const pts = routePointsRef.current;
        if (!map || !pts || busLat == null || busLng == null) return;
        // Remove old active segment (index 1)
        if (routeLayersRef.current[1]) {
          map.removeLayer(routeLayersRef.current[1]);
          routeLayersRef.current[1] = null;
        }
        const busIdx = closestPointIndex(pts, busLat, busLng);
        const stopEnd = stopCoords.current
          ? closestPointIndex(pts, stopCoords.current.lat, stopCoords.current.lng)
          : pts.length - 1;
        const start = Math.min(busIdx, stopEnd);
        const end   = Math.max(busIdx, stopEnd);
        const segment = pts.slice(start, end + 1);
        if (segment.length < 2) return;
        const routeColor = lineColor(bus.line);
        const layer = L.polyline(segment, {
          color: routeColor, weight: 4, opacity: 0.75,
          lineCap: "round", lineJoin: "round",
        }).addTo(map);
        routeLayersRef.current[1] = layer;
      }, [bus.line]);

      // ── plot fleet markers (called on load + refresh) ──────────
      const plotFleet = useCallback((busArray, tappedBus) => {
        const map = leafletRef.current;
        if (!map) return;
        // Remove existing bus markers
        fleetMarkers.current.forEach(m => map.removeLayer(m));
        fleetMarkers.current = [];

        const busesWithCoords = busArray.filter(b => b.vehicleLat && b.vehicleLng);
        busesWithCoords.forEach((b) => {
          const tappedTime = tappedBus.expectedArrival || tappedBus.aimedArrival;
          const thisTime   = b.expectedArrival || b.aimedArrival;
          const isTapped   = b.line === tappedBus.line && thisTime === tappedTime;
          const isoTime  = b.expectedArrival || b.aimedArrival;
          const mins     = isoTime ? minutesUntil(isoTime) : null;
          const timeLabel = mins === null || mins <= 0 ? "NOW" : mins + " min";
          const pinLabel = isTapped ? "🚌" : timeLabel;
          const opacity  = isTapped ? "1" : "0.5";
          const pinSize  = isTapped ? "18px" : "11px";
          const html = '<div style="display:flex;align-items:center;justify-content:center;background:' + color + ';color:#0a0a0a;font-family:DM Mono,monospace;font-weight:700;font-size:' + pinSize + ';padding:5px 8px;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,0.7);white-space:nowrap;position:relative;opacity:' + opacity + ';">' + pinLabel + '<div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid ' + color + ';"><\/div><\/div>';
          const icon = L.divIcon({ className: "bus-pin-label", html, iconSize: [52, 32], iconAnchor: [26, 38] });
          const marker = L.marker([b.vehicleLat, b.vehicleLng], { icon })
            .addTo(map)
            .bindPopup('<b style="font-family:DM Sans,sans-serif">' + b.line + ' \u2192 ' + b.destination + '<\/b><br><span style="font-family:DM Mono,monospace;font-size:12px;color:#F5A623">' + timeLabel + '<\/span>');
          fleetMarkers.current.push(marker);
        });
      }, [color]);

      // ── refresh: re-fetch MTA and re-plot ──────────────────────
      const refresh = useCallback(async () => {
        if (isRefreshing.current) return;
        isRefreshing.current = true;
        setRefreshing(true);
        try {
          const raw = `https://bustime.mta.info/api/siri/stop-monitoring.xml`
            + `?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const res  = await fetch(PROXY + encodeURIComponent(raw));
          const text = await res.text();
          const allBuses   = parseXML(text);
          const freshFleet = allBuses.filter(b => {
            if (b.line !== line) return false;
            const iso = b.expectedArrival || b.aimedArrival;
            if (!iso) return true; // no time = approaching now, always show
            const m = minutesUntil(iso);
            return m >= -1 && m <= 30;
          });
          // Identify refreshed version of tapped bus before plotting
          let freshBus = null;
          const tappedTime = bus.expectedArrival || bus.aimedArrival;
          // Prefer matching by schedule time when available
          if (tappedTime) {
            freshBus = freshFleet.find(b =>
              b.line === bus.line &&
              (b.expectedArrival || b.aimedArrival) === tappedTime
            ) || null;
          }
          // Fallback: match by closest GPS position on same line when there is no reliable time
          if (!freshBus && bus.vehicleLat != null && bus.vehicleLng != null) {
            let best = null;
            let bestDist = Infinity;
            freshFleet.forEach(b => {
              if (b.line !== bus.line || b.vehicleLat == null || b.vehicleLng == null) return;
              const d = distanceMeters(bus.vehicleLat, bus.vehicleLng, b.vehicleLat, b.vehicleLng);
              if (d < bestDist) {
                bestDist = d;
                best = b;
              }
            });
            freshBus = best;
          }
          if (!freshBus) freshBus = bus;
          plotFleet(freshFleet, freshBus);
          // Redraw active segment with updated bus position
          if (freshBus.vehicleLat != null && freshBus.vehicleLng != null) {
            drawActiveSegment(freshBus.vehicleLat, freshBus.vehicleLng);
          }
          setLastRefresh(new Date());
        } catch (e) {
          console.error("Map refresh failed:", e);
        } finally {
          isRefreshing.current = false;
          setRefreshing(false);
        }
      }, [stopId, line, bus, plotFleet, drawActiveSegment]);

      // Center map on user location
      const centerOnUser = useCallback(() => {
        if (!leafletRef.current) return;
        navigator.geolocation.getCurrentPosition((pos) => {
          leafletRef.current.setView([pos.coords.latitude, pos.coords.longitude], 17);
          if (userMarker.current) {
            userMarker.current.setLatLng([pos.coords.latitude, pos.coords.longitude]);
          }
        }, null, GEO_OPTS);
      }, []);

      useEffect(() => {
        // Init map
        const map = L.map(mapRef.current, {
          zoomControl: true,
          attributionControl: true,
        });
        leafletRef.current = map;

        // Theme-aware tiles
        const tileUrl = TILE_URLS[THEMES[theme]?.mapTiles ?? "dark"];
        L.tileLayer(
          tileUrl,
          {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ).addTo(map);

        // User location pin
        const userIcon = L.divIcon({
          className: "bus-pin-label",
          html: '<div style="width:16px;height:16px;border-radius:50%;background:#4A90D9;border:3px solid #fff;box-shadow:0 0 0 3px rgba(74,144,217,0.35),0 2px 8px rgba(0,0,0,0.6);"><\/div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8],
        });


        // Default center: NYC fallback
        let defaultCenter = [40.6782, -73.9442]; // Brooklyn

        // ── fetch stop coordinates and plot 🚏 marker ──────────
        const stopIcon = L.divIcon({
          className: "bus-pin-label",
          html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));">🚏<\/div>',
          iconSize: [28, 28],
          iconAnchor: [6, 28],
        });

        // OneBusAway requires MTA_ prefix on the stop ID
        fetch(PROXY + encodeURIComponent(
          `https://bustime.mta.info/api/where/stop/MTA_${stopId}.json?key=${API_KEY}`
        ))
          .then(r => r.json())
          .then(data => {
            const lat = data?.data?.lat;
            const lng = data?.data?.lon;
            if (!lat || !lng) return;
            stopCoords.current = { lat, lng };
            stopMarker.current = L.marker([lat, lng], { icon: stopIcon })
              .addTo(map)
              .bindPopup('<span style="font-family:DM Sans,sans-serif">Stop ' + stopId + '<\/span>');
            // Re-fit bounds now that we have stop coords — fixes race condition
            // where geolocation resolved before stop fetch completed
            const points = [];
            if (userMarker.current) {
              const ul = userMarker.current.getLatLng();
              points.push([ul.lat, ul.lng]);
            }
            if (bus.vehicleLat && bus.vehicleLng) points.push([bus.vehicleLat, bus.vehicleLng]);
            points.push([lat, lng]);
            if (points.length > 1 && leafletRef.current) {
              leafletRef.current.fitBounds(L.latLngBounds(points), { padding: [80, 80], maxZoom: 17 });
            }
          })
          .catch((e) => console.warn("Stop fetch failed:", e));

        // ── fetch route shape and draw polyline ──────────
        if (bus.shapeRef) {
          fetch(PROXY + encodeURIComponent(
            `https://bustime.mta.info/api/where/shape/${bus.shapeRef}.json?key=${API_KEY}`
          ))
            .then(r => r.json())
            .then(data => {
              const encoded = data?.data?.entry?.points;
              if (!encoded) return;
              const pts = decodePolyline(encoded);
              if (pts.length < 2) return;
              routePointsRef.current = pts;
              const routeColor = lineColor(bus.line);
              // Layer 1: full route ghost
              const ghost = L.polyline(pts, {
                color: routeColor, weight: 3, opacity: 0.25,
                lineCap: "round", lineJoin: "round",
              }).addTo(map);
              routeLayersRef.current[0] = ghost;
              // Layer 2: active segment (bus → stop)
              if (bus.vehicleLat != null && bus.vehicleLng != null) {
                drawActiveSegment(bus.vehicleLat, bus.vehicleLng);
              }
            })
            .catch(() => {}); // fail silently
        }

        // Plot initial fleet
        plotFleet(fleet || [bus], bus);

        // Request user location, center map on it at ~1 mile zoom (z=15)
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              defaultCenter = [latitude, longitude];
              map.setView(defaultCenter, 15);
              userMarker.current = L.marker([latitude, longitude], { icon: userIcon })
                .addTo(map)
                .bindPopup('<span style="font-family:DM Sans,sans-serif">You are here<\/span>');

              // Fit view: user + tapped bus + stop (whichever coords are available)
              const points = [[latitude, longitude]];
              if (bus.vehicleLat && bus.vehicleLng) points.push([bus.vehicleLat, bus.vehicleLng]);
              if (stopCoords.current) points.push([stopCoords.current.lat, stopCoords.current.lng]);
              if (points.length > 1) {
                map.fitBounds(L.latLngBounds(points), { padding: [80, 80], maxZoom: 17 });
              }
            },
            () => {
              // Geolocation denied or failed — center on bus or Brooklyn
              if (bus.vehicleLat && bus.vehicleLng) {
                map.setView([bus.vehicleLat, bus.vehicleLng], 15);
              } else {
                map.setView(defaultCenter, 14);
              }
            },
            GEO_OPTS
          );
        } else {
          map.setView(defaultCenter, 14);
        }

        // Close on Escape
        const handleKey = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handleKey);

        return () => {
          map.remove();
          window.removeEventListener("keydown", handleKey);
        };
      }, []);

      const isoTime   = bus.expectedArrival || bus.aimedArrival;
      const minutes   = isoTime ? minutesUntil(isoTime) : null;
      const timeLabel = minutes === null || minutes <= 0 ? "NOW" : `${minutes} min`;
      const isImminent = minutes === null || minutes <= 2;
      const isRedAlert    = minutes !== null && minutes < 5;
      const isYellowAlert = minutes !== null && minutes >= 5 && minutes <= 10;
      const etaColor = isRedAlert ? "#C03A20" : isYellowAlert ? "#F5A623" : "var(--text-primary)";
      const noGPS = (fleet || [bus]).filter(b => b.vehicleLat && b.vehicleLng).length === 0;

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 1000,
          animation: "modalIn 0.2s ease",
        }}>
          {/* Full-screen map */}
          <div ref={mapRef} style={{ position: "absolute", inset: 0 }} />

          {/* ── Bottom-right: recenter + refresh — sit above the card ── */}
          <div style={{
            position: "absolute", bottom: 100, right: "16px", zIndex: 1002,
            display: "flex", flexDirection: "column", gap: "8px",
          }}>
            <button onClick={centerOnUser} title="Center on my location" style={{
              width: "44px", height: "44px",
              background: "rgba(13,13,13,0.92)", border: "1px solid #2a2a2a",
              borderRadius: "50%", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A90D9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
              </svg>
            </button>
            <button onClick={refresh} title="Refresh bus locations" style={{
              width: "44px", height: "44px",
              background: "rgba(13,13,13,0.92)", border: "1px solid #2a2a2a",
              borderRadius: "50%", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={refreshing ? "#555" : "#7EC8A0"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: refreshing ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.5s ease" }}>
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
          </div>

          {/* ── Floating info card ── */}
          <div style={{
            position: "absolute",
            bottom: "calc(16px + env(safe-area-inset-bottom, 0px))",
            left: "16px", right: "16px",
            zIndex: 1001,
            background: "var(--map-card-bg)",
            border: "1px solid var(--map-card-border)",
            boxShadow: "0 4px 20px rgba(0,0,0,0.12)",
            borderRadius: "18px",
            touchAction: "none",
          }}>
            <div style={{
              display: "flex", alignItems: "center", gap: "14px",
              padding: "16px 18px",
            }}>
              {/* Line badge */}
              <div style={{
                ...badgeStyle(), color: "var(--map-card-text)",
                flexShrink: 0,
              }}>{bus.line}</div>

              {/* Destination + status */}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontFamily: "'DM Sans', sans-serif", fontSize: "14px",
                  color: "var(--map-card-text)", fontWeight: 600, letterSpacing: "0.4px",
                  whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                }}>→ {bus.destination}</div>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontSize: "10px",
                  color: "var(--map-card-subtext)", marginTop: "3px",
                }}>
                  {bus.presentableDistance || ""}
                  {lastRefresh && (
                    <span style={{ color: "var(--map-card-subtext)" }}>
                      {bus.presentableDistance ? " · " : ""}updated {lastRefresh.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                    </span>
                  )}

              </div>

              {/* ETA */}
              <div style={{ textAlign: "right", flexShrink: 0, minWidth: "48px" }}>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "28px", lineHeight: 1, color: etaColor,
                }}>{minutes !== null ? (minutes <= 0 ? "NOW" : minutes) : "NOW"}</div>
                {minutes !== null && minutes > 0 && (
                  <div style={{ fontSize: "10px", color: "var(--map-card-subtext)", fontFamily: "'DM Mono', monospace", marginTop: "2px" }}>min</div>
                )}

              {/* Close */}
              <button onClick={onClose} style={{

                background: "var(--map-card-close-bg)", border: "1px solid var(--map-card-border)",
                borderRadius: "50%", cursor: "pointer", color: "var(--map-card-close-color)",
                fontSize: "20px", display: "flex", alignItems: "center",
                justifyContent: "center", fontFamily: "'DM Mono', monospace",
              }}>×</button>
            </div>
          </div>
        </div>
      );
    }

    /* ── parse scheduled timetable XML ──────────────────────── */
    function parseTimetableXML(xmlString) {
      let doc = new DOMParser().parseFromString(xmlString, "text/xml");
      if (doc.querySelector("parsererror"))
        doc = new DOMParser().parseFromString(xmlString, "application/xml");
      const visits = getEls(doc, "TimetabledStopVisit");
      return Array.from(visits).map((v) => {
        const mvj  = getEls(v, "MonitoredVehicleJourney")[0];
        const call = getEls(v, "MonitoredCall")[0];
        const rawLine = xmlText(mvj, "PublishedLineName") || "";
        return {
          line:        rawLine.replace(/MTA NYCT_/i, "").trim(),
          destination: xmlText(mvj, "DestinationName") || rawLine,
          aimedArrival: xmlText(call, "AimedArrivalTime"),
          expectedArrival: null,
          presentableDistance: null,
          stopsAway: null,
          vehicleLat: null,
          vehicleLng: null,
          isScheduled: true,
        };
      });
    }
    function BusRow({ bus, theme, onOpenMap, onBellToggle, isTracked, showDenied, isStuck }) {
      const isoTime    = bus.expectedArrival || bus.aimedArrival;
      const minutes    = isoTime ? minutesUntil(isoTime) : null;
      const isImminent = minutes === null || minutes <= 2;

      // Urgency levels
      const isRedAlert    = minutes !== null && minutes < 5;
      const isYellowAlert = minutes !== null && minutes >= 5 && minutes <= 10;

      const bgStyle = isRedAlert
        ? { animation: "breathe-urg 2s ease-in-out infinite" }
        : isYellowAlert
        ? { animation: "breathe-warn 2s ease-in-out infinite" }
        : { background: "var(--bg-row)", animation: "fadeIn 0.25s ease" };

      return (
        <>
          <div
            onClick={() => onOpenMap(bus)}
            style={{
              display: "flex", alignItems: "center", gap: "14px",
              padding: "13px 16px",
              ...bgStyle,
              borderRadius: "8px",
              marginBottom: showDenied ? "0" : "6px",
              cursor: "pointer",
            }}
            onMouseEnter={(e) => e.currentTarget.style.filter = "brightness(0.97)"}
            onMouseLeave={(e) => e.currentTarget.style.filter = "brightness(1)"}
          >
            {/* line badge */}
            <div style={{
              ...badgeStyle(), color: "var(--text-primary)",
              minWidth: "42px", textAlign: "center", flexShrink: 0,
            }}>{bus.line || "?"}</div>

            {/* destination + distance */}
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "var(--text-primary)", fontWeight: 600,
                whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
              }}>→ {bus.destination}</div>
              {(bus.presentableDistance || isStuck) && (
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: isStuck ? "#C03A20" : "var(--text-hint)", fontWeight: isStuck ? 500 : 400, marginTop: "2px" }}>
                  {isStuck
                    ? "stuck in traffic"
                    : `${bus.presentableDistance}${bus.stopsAway != null && !bus.presentableDistance?.toLowerCase().includes("stop") ? ` · ${bus.stopsAway} stop${bus.stopsAway !== 1 ? "s" : ""} away` : ""}`
                  }
                </div>
              )}
            </div>

            {/* bell toggle – hidden on iOS where Web Notifications aren't supported */}
            {!isIOS && (
              <button
                onClick={(e) => { e.stopPropagation(); onBellToggle && onBellToggle(bus, e); }}
                style={{
                  background: isTracked ? "var(--accent-muted-bg)" : "transparent",
                  border: "none", cursor: "pointer",
                  width: "32px", height: "32px",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  borderRadius: "4px", flexShrink: 0, padding: 0,
                }}
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke={isTracked ? "var(--accent)" : "var(--text-faint)"}
                  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
              </button>
            )}

            {/* countdown + map hint */}
            <div style={{ textAlign: "right", flexShrink: 0 }}>
              {minutes !== null ? (
                <>
                  <div style={{
                    fontFamily: "'DM Mono', monospace", fontWeight: 700,
                    fontSize: "26px", lineHeight: 1,
                    color: isRedAlert ? "#C03A20" : isYellowAlert ? "#F5A623" : "var(--text-primary)",
                    animation: isRedAlert ? "pulse-num 2s ease-in-out infinite" : "none",
                  }}>{minutes <= 0 ? "NOW" : minutes}</div>
                  {minutes > 0 && <div style={{ fontSize: "10px", color: "var(--text-muted)", fontFamily: "'DM Mono', monospace", marginTop: "2px" }}>min</div>}
                </>
              ) : (
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "26px", lineHeight: 1, color: "#C03A20",
                  animation: "pulse-num 2s ease-in-out infinite",
                }}>NOW</div>
              )}
            </div>
          </div>
          {!isIOS && showDenied && (
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#C03A20",
              padding: "4px 16px 8px", marginBottom: "8px",
            }}>Enable notifications in your browser settings</div>
          )}
        </>
      );
    }

    /* ── ScheduledBusRow ─────────────────────────────────────── */
    function ScheduledBusRow({ bus, theme }) {
      const isoTime = bus.aimedArrival;
      const minutes = isoTime ? minutesUntil(isoTime) : null;
      if (minutes !== null && (minutes < -1 || minutes > 30)) return null;

      return (
        <div style={{
          display: "flex", alignItems: "center", gap: "14px",
          padding: "13px 16px",
          background: "var(--bg-row-scheduled)",
          borderRadius: "8px",
          marginBottom: "6px",
        }}>
          {/* muted line badge */}
          <div style={{
            color: "var(--text-secondary)",
            fontFamily: "'DM Mono', monospace", fontWeight: 700,
            fontSize: "15px", minWidth: "42px", textAlign: "center",
            flexShrink: 0, letterSpacing: "0.3px",
          }}>{bus.line || "?"}</div>

          {/* destination + offline badge */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "var(--text-secondary)",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>→ {bus.destination}</div>
            <div style={{
              display: "inline-flex", alignItems: "center", gap: "4px",
              marginTop: "4px",
            }}>
              {/* clock icon */}
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "9px", color: "var(--text-faint)", letterSpacing: "1px", textTransform: "uppercase" }}>scheduled</span>
            </div>
          </div>

          {/* countdown */}
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            {minutes !== null ? (
              <>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "24px", lineHeight: 1, color: "var(--text-faint)",
                }}>{minutes <= 0 ? "NOW" : minutes}</div>
                {minutes > 0 && <div style={{ fontSize: "10px", color: "var(--text-faint)", fontFamily: "'DM Mono', monospace", marginTop: "2px" }}>min</div>}
              </>
            ) : (
              <div style={{ fontFamily: "'DM Mono', monospace", fontWeight: 700, fontSize: "24px", lineHeight: 1, color: "var(--text-faint)" }}>–</div>
            )}
          </div>
        </div>
      );
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    /* ── triggerAlert ────────────────────────────────────────── */
    function triggerAlert(bus, mins) {
      if (isIOS) return;
      const label = `${bus.line} → ${bus.destination}`;
      const body  = mins <= 0 ? "Arriving now" : `Arriving in ~${mins} min`;
      const tag   = `bus-alert-${bus.line}_${bus.aimedArrival || bus.expectedArrival || ""}`;
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        new Notification(label, {
          body,
          icon: "/favicon.ico",
          tag,
          renotify: false,
        });
      }
    }

    /* ── StopPanel ───────────────────────────────────────────── */
    function StopPanel({ index, stopId, label, theme, trackedAlerts, onAddTrackedAlert, onRemoveTrackedAlert, onRemove, onRename, onOpenMap, onDataUpdated }) {
      const [buses,           setBuses]           = useState([]);
      const [loading,         setLoading]         = useState(false);
      const [lastUpdated,     setLastUpdated]     = useState(null);
      const [fetchError,      setFetchError]      = useState(null);
      const [stopNameFromApi, setStopNameFromApi] = useState(null);
      const [isEditing,       setIsEditing]       = useState(false);
      const [hoverHeader,     setHoverHeader]     = useState(false);
      const editInputRef      = useRef(null);

      const trackedAlertsRef = useRef(new Set());
      const firedAlerts      = useRef(new Set());
      const stopHistory      = useRef({});
      const [deniedBusKey,   setDeniedBusKey] = useState(null);

      const displayId = (stopId || "").replace(/^MTA_/i, "");
      const primaryLabel = (label && label.trim()) ? label.trim() : (stopNameFromApi || displayId);

      useEffect(() => {
        if (!displayId) return;
        const url = `https://bustime.mta.info/api/where/stop/MTA_${displayId}.json?key=${API_KEY}`;
        fetch(PROXY + encodeURIComponent(url))
          .then((r) => r.json())
          .then((data) => { if (data?.data?.name) setStopNameFromApi(data.data.name); })
          .catch(() => {});
      }, [displayId]);

      useEffect(() => { if (isEditing && editInputRef.current) editInputRef.current.focus(); }, [isEditing]);

      const handleConfirmEdit = (value) => {
        const trimmed = (value || "").trim();
        const effectiveLabel = trimmed || stopNameFromApi || displayId;
        onRename?.(index, effectiveLabel);
        setIsEditing(false);
      };
      const handleCancelEdit = () => setIsEditing(false);

      useEffect(() => {
        trackedAlertsRef.current = trackedAlerts;
      }, [trackedAlerts]);

      const handleBellToggle = useCallback((bus, e) => {
        e.stopPropagation();
        const arrival = bus.aimedArrival || bus.expectedArrival;
        if (!arrival) return;
        const key = `${bus.line}_${arrival}`;
        if (trackedAlerts.has(key)) {
          onRemoveTrackedAlert(key);
          return;
        }
        const showDenied = () => {
          setDeniedBusKey(key);
          setTimeout(() => setDeniedBusKey(null), 4000);
        };
        if (typeof Notification === "undefined") { onAddTrackedAlert(key); return; }
        if (Notification.permission === "default") {
          Notification.requestPermission().then((perm) => { if (perm === "granted") onAddTrackedAlert(key); else showDenied(); });
        } else if (Notification.permission === "granted") {
          onAddTrackedAlert(key);
        } else {
          showDenied();
        }
      }, [trackedAlerts, onAddTrackedAlert, onRemoveTrackedAlert]);

      const fetchData = useCallback(async () => {
        if (!stopId) return;
        setLoading(true);
        setFetchError(null);
        try {
          // Fetch real-time and timetable in parallel
          const realtimeRaw   = `https://bustime.mta.info/api/siri/stop-monitoring.xml?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const timetableRaw  = `https://bustime.mta.info/api/siri/stop-timetable.xml?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;

          const [rtRes, ttRes] = await Promise.all([
            fetch(PROXY + encodeURIComponent(realtimeRaw)),
            fetch(PROXY + encodeURIComponent(timetableRaw)),
          ]);
          const [rtText, ttText] = await Promise.all([rtRes.text(), ttRes.text()]);

          const realtime  = parseXML(rtText);
          const scheduled = parseTimetableXML(ttText);

          // Merge: drop scheduled entries that already have a real-time match
          // Match = same line + aimed arrival within 3 minutes of a real-time entry
          const unmatched = scheduled.filter((s) => {
            if (!s.aimedArrival) return false;
            const sTime = new Date(s.aimedArrival).getTime();
            return !realtime.some((r) => {
              if (r.line !== s.line) return false;
              const rTime = new Date(r.expectedArrival || r.aimedArrival || 0).getTime();
              return Math.abs(sTime - rTime) <= 3 * 60 * 1000; // 3 min tolerance
            });
          });

          const freshBuses = [...realtime, ...unmatched];
          setBuses(freshBuses);

          // Update stop history for stuck-in-traffic detection
          realtime.forEach((bus) => {
            if (!bus.aimedArrival || bus.stopsAway === null) return;
            const key = `${bus.line}_${bus.aimedArrival}`;
            const prev = stopHistory.current[key];
            const delayMinutes = bus.expectedArrival && bus.aimedArrival
              ? (new Date(bus.expectedArrival) - new Date(bus.aimedArrival)) / 60000
              : 0;
            if (!prev) {
              stopHistory.current[key] = { stopsAway: bus.stopsAway, consecutiveUnchanged: 0, delayMinutes };
              return;
            }
            const unchanged = bus.stopsAway >= prev.stopsAway;
            stopHistory.current[key] = {
              stopsAway: bus.stopsAway,
              consecutiveUnchanged: unchanged ? prev.consecutiveUnchanged + 1 : 0,
              delayMinutes,
            };
          });
          // Purge stale keys
          const now = Date.now();
          Object.keys(stopHistory.current).forEach((k) => {
            const aimed = k.split("_").slice(1).join("_");
            if (aimed && (now - new Date(aimed).getTime()) > 5 * 60 * 1000) {
              delete stopHistory.current[k];
            }
          });

          freshBuses.forEach((bus) => {
            const iso = bus.expectedArrival || bus.aimedArrival;
            if (!iso) return;
            const mins = minutesUntil(iso);
            const key = `${bus.line}_${bus.aimedArrival || bus.expectedArrival}`;
            if (trackedAlertsRef.current.has(key) && mins <= 10 && mins >= 0 && !firedAlerts.current.has(key)) {
              firedAlerts.current.add(key);
              triggerAlert(bus, mins);
            }
          });
          const updated = new Date();
          setLastUpdated(updated);
          onDataUpdated?.(updated);
        } catch (e) {
          setFetchError(e.message);
        } finally {
          setLoading(false);
        }
      }, [stopId]);

      useEffect(() => {
        fetchData();
        const t = setInterval(fetchData, 30000);
        return () => { clearInterval(t); firedAlerts.current = new Set(); };
      }, [fetchData]);

      const visible = buses
        .filter((b) => {
          const iso = b.expectedArrival || b.aimedArrival;
          if (!iso) return true;
          const m = minutesUntil(iso);
          return m >= -1 && m <= 30;
        })
        .sort((a, b) => {
          const tA = new Date(a.expectedArrival || a.aimedArrival || 0).getTime();
          const tB = new Date(b.expectedArrival || b.aimedArrival || 0).getTime();
          return tA - tB;
        });

      const stuckSet = new Set(
        Object.entries(stopHistory.current)
          .filter(([_, v]) => v.consecutiveUnchanged >= 2 && v.delayMinutes > 3)
          .map(([k]) => k)
      );

      return (
        <div style={{ marginBottom: "28px", animation: "fadeIn 0.3s ease" }}>
          {/* stop header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" }}>
            <div
              style={{ display: "flex", flexDirection: "column", gap: "2px", flex: 1, minWidth: 0 }}
              onMouseEnter={() => setHoverHeader(true)}
              onMouseLeave={() => setHoverHeader(false)}
            >
              {isEditing ? (
                <input
                  ref={editInputRef}
                  type="text"
                  defaultValue={primaryLabel}
                  onBlur={(e) => handleConfirmEdit(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") { e.preventDefault(); handleConfirmEdit(e.target.value); }
                    if (e.key === "Escape") { e.preventDefault(); handleCancelEdit(); }
                  }}
                  style={{
                    fontFamily: "'DM Sans', sans-serif", fontSize: "15px", fontWeight: 600, color: "var(--text-primary)",
                    background: "transparent", border: "none", borderBottom: "1px solid var(--accent)", outline: "none",
                    padding: "0 0 2px 0", width: "100%",
                  }}
                />
              ) : (
                <div
                  style={{
                    display: "inline-flex", alignItems: "center", gap: "6px", cursor: "text",
                    fontFamily: "'DM Sans', sans-serif", fontSize: "15px", fontWeight: 600, color: "var(--text-primary)",
                  }}
                  onClick={() => setIsEditing(true)}
                >
                  <span style={{ minWidth: 0 }}>{primaryLabel}</span>
                  {hoverHeader && <span style={{ fontFamily: "serif", fontSize: "12px", color: "var(--text-faint)", flexShrink: 0 }}>✎</span>}
                </div>
              )}
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "var(--text-muted)" }}>#{displayId}</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "10px", flexShrink: 0 }}>
              {loading && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#2E8A52", animation: "blink 1s ease-in-out infinite" }} />}
              <button onClick={onRemove} title="Remove stop" style={{
                background: "transparent", border: "none", cursor: "pointer",
                color: "var(--text-faint)", fontSize: "18px", lineHeight: 1,
                padding: "2px 4px", fontFamily: "'DM Mono', monospace",
              }}>×</button>
            </div>
          </div>

          <div style={{ height: "1px", background: "var(--border-divider)", marginBottom: "12px" }} />

          {fetchError ? (
            <div style={{
              padding: "14px", background: "rgba(208,52,31,0.05)",
              border: "1px solid rgba(208,52,31,0.15)", borderRadius: "8px",
              fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#C03A20",
            }}>Error: {fetchError}</div>
          ) : visible.length === 0 ? (
            <div style={{
              padding: "18px", background: "transparent",
              border: "1px dashed var(--border-add-trigger)", borderRadius: "8px",
              textAlign: "center", color: "var(--text-muted)",
              fontFamily: "'DM Mono', monospace", fontSize: "12px",
            }}>{loading ? "Loading…" : "No buses within 30 min"}</div>
          ) : (
            visible.map((bus, i) => (
              bus.isScheduled
                ? <ScheduledBusRow key={i} bus={bus} theme={theme} />
                : <BusRow
                    key={i}
                    bus={bus}
                    theme={theme}
                    onOpenMap={(tapped) => onOpenMap(tapped, visible.filter(b => b.line === tapped.line), stopId, tapped.line)}
                    onBellToggle={handleBellToggle}
                    isTracked={(bus.aimedArrival || bus.expectedArrival) != null && trackedAlerts.has(`${bus.line}_${bus.aimedArrival || bus.expectedArrival}`)}
                    showDenied={deniedBusKey === `${bus.line}_${bus.aimedArrival || bus.expectedArrival}`}
                    isStuck={stuckSet.has(`${bus.line}_${bus.aimedArrival}`)}
                  />
            ))
          )}
        </div>
      );
    }

    /* ── AddStopTrigger ───────────────────────────────────────── */
    function AddStopTrigger({ onClick, hasStops }) {
      return (
        <button
          type="button"
          onClick={onClick}
          style={{
            width: "100%",
            border: "1px dashed var(--border-add-trigger)",
            borderRadius: "8px",
            padding: "18px",
            background: "transparent",
            color: "var(--text-muted)",
            fontFamily: "'DM Sans', sans-serif",
            fontSize: "14px", fontWeight: 600,
            cursor: "pointer",
            marginBottom: "32px",
          }}
        >
          + Add Stop
        </button>
      );
    }

    /* ── ThemeSwitcher ────────────────────────────────────────── */
    function ThemeSwitcher({ theme, onChange }) {
      const themes = [
        { key: "default",   label: "Default",   swatch: "#F7F6F2", dot: "#1A1A1A" },
        { key: "parchment", label: "Parchment", swatch: "#EDE8DC", dot: "#A86200" },
        { key: "lavender",  label: "Lavender",  swatch: "#E6E0FF", dot: "#5540B0" },
        { key: "slate",     label: "Slate",     swatch: "#1A1E2E", dot: "#D08820" },
      ];
      return (
        <div style={{ display: "flex", gap: "6px", alignItems: "center" }}>
          {themes.map(({ key, label, swatch, dot }) => (
            <button
              key={key}
              title={label}
              onClick={() => onChange(key)}
              style={{
                width: "26px", height: "26px",
                borderRadius: "6px",
                border: theme === key
                  ? "2px solid var(--accent)"
                  : "1.5px solid var(--border-main)",
                background: swatch,
                cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                padding: 0,
                flexShrink: 0,
                position: "relative",
              }}
            >
              {theme === key && (
                <div style={{
                  width: "8px", height: "8px", borderRadius: "50%",
                  background: dot,
                }} />
              )}
            </button>
          ))}
        </div>
      );
    }

    /* ── AddStopModal ─────────────────────────────────────────── */
    function AddStopModal({ onAdd, onClose, theme }) {
      const [tab, setTab] = useState("enterId");
      const [id, setId] = useState("");
      const [label, setLabel] = useState("");
      const inputRef = useRef();
      const [nearbyGroups, setNearbyGroups] = useState([]);
      const [nearbyLoadingPhase, setNearbyLoadingPhase] = useState(null); // "stops" | "arrivals" | null
      const [nearbyError, setNearbyError] = useState(null);
      const [selectedKeys, setSelectedKeys] = useState(new Set()); // "idClean|line|headsign"
      const nearbyFetched = useRef(false);

      const close = useCallback(() => {
        nearbyFetched.current = false;
        setTab("enterId");
        setId("");
        setLabel("");
        setNearbyGroups([]);
        setNearbyError(null);
        setSelectedKeys(new Set());
        onClose();
      }, [onClose]);

      useEffect(() => {
        const handleKey = (e) => { if (e.key === "Escape") close(); };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [close]);

      const submitEnterId = () => {
        const trimmed = id.trim();
        if (!trimmed) return;
        onAdd({ id: trimmed.replace(/^MTA_/i, ""), label: label.trim() });
        close();
      };

      const fetchNearby = useCallback(async (lat, lon) => {
        setNearbyError(null);
        setNearbyLoadingPhase("stops");
        try {
          const url = `https://bustime.mta.info/api/where/stops-for-location.json?key=${API_KEY}&lat=${lat}&lon=${lon}&radius=400`;
          const res = await fetch(PROXY + encodeURIComponent(url));
          const rawText = await res.text();
          if (!res.ok) {
            setNearbyError("Couldn't load nearby stops — check your connection and try again");
            setNearbyGroups([]);
            setNearbyLoadingPhase(null);
            return;
          }
          let data;
          try {
            data = JSON.parse(rawText);
          } catch (_) {
            setNearbyError("Couldn't load nearby stops — check your connection and try again");
            setNearbyGroups([]);
            setNearbyLoadingPhase(null);
            return;
          }
          if (data.code !== undefined && data.code !== 200) {
            setNearbyError("Couldn't load nearby stops — check your connection and try again");
            setNearbyGroups([]);
            setNearbyLoadingPhase(null);
            return;
          }
          const payload = data.data != null ? data.data : data;
          const list = Array.isArray(payload.list) ? payload.list : (Array.isArray(payload.stops) ? payload.stops : []);
          const refs = payload.references || data.references || {};
          const routesList = Array.isArray(refs.routes) ? refs.routes : Object.values(refs.routes || {});
          const stopsWithMeta = list.map((s) => {
            const routeIds = s.routeIds || (s.routeId ? [s.routeId] : []);
            const routes = routesList.filter((r) => routeIds.includes(r.id));
            let shortNames = routes.map((r) => r.shortName || r.id).filter(Boolean);
            if (shortNames.length === 0 && (s.routes || s.routeShortNames)) {
              const fromStop = s.routeShortNames || (s.routes || []).map((r) => (typeof r === "string" ? r : (r && r.shortName) || (r && r.id)));
              shortNames = [].concat(fromStop).filter(Boolean);
            }
            const meters = distanceMeters(lat, lon, s.lat, s.lon);
            return {
              ...s,
              idClean: (s.code != null ? String(s.code) : (s.id || "").replace(/^MTA_/i, "")),
              routeShortNames: shortNames,
              distanceM: meters,
              distanceFt: Math.round(meters * 3.28084),
            };
          });

          setNearbyLoadingPhase("arrivals");
          const siriUrls = stopsWithMeta.map((stop) =>
            `https://bustime.mta.info/api/siri/stop-monitoring.xml?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=MTA_${stop.idClean}&MaximumStopVisits=20`
          );
          const siriResponses = await Promise.all(
            siriUrls.map((url) => fetch(PROXY + encodeURIComponent(url)).then((r) => r.text()).catch(() => null))
          );

          const groupMap = new Map();
          const addStopToGroup = (line, headsign, stop) => {
            const key = line + "|" + headsign;
            if (!groupMap.has(key)) groupMap.set(key, { line, headsign, stops: [] });
            const g = groupMap.get(key);
            if (!g.stops.some((t) => (t.idClean || t.id) === (stop.idClean || stop.id))) g.stops.push(stop);
          };

          stopsWithMeta.forEach((stop, i) => {
            const xmlText = siriResponses[i];
            let visits = [];
            if (xmlText) {
              try {
                visits = parseXML(xmlText);
              } catch (_) {}
            }
            const seen = new Set();
            if (visits.length > 0) {
              visits.forEach((v) => {
                const line = (v.line || "").trim();
                const headsign = (v.destination || "").trim().toUpperCase() || "—";
                if (!line) return;
                const pair = line + "|" + headsign;
                if (seen.has(pair)) return;
                seen.add(pair);
                addStopToGroup(line, headsign, stop);
              });
            } else {
              const fallbackLine = (stop.routeShortNames && stop.routeShortNames[0]) || "?";
              const fallbackHeadsign = (stop.name || "Unknown").trim().toUpperCase();
              addStopToGroup(fallbackLine, fallbackHeadsign, stop);
            }
          });

          const groups = Array.from(groupMap.values());
          groups.forEach((g) => g.stops.sort((a, b) => a.distanceM - b.distanceM));
          groups.sort((a, b) => {
            const minA = Math.min(...a.stops.map((s) => s.distanceM));
            const minB = Math.min(...b.stops.map((s) => s.distanceM));
            return minA - minB;
          });
          setNearbyGroups(groups);
          if (groups.length === 0) {
            setNearbyError("No active stops found nearby — try entering a Stop ID manually");
          }
        } catch (e) {
          setNearbyError("Couldn't load nearby stops — check your connection and try again");
          setNearbyGroups([]);
        } finally {
          setNearbyLoadingPhase(null);
        }
      }, []);

      const onTabNearby = () => {
        setTab("nearby");
        if (nearbyFetched.current) return;
        nearbyFetched.current = true;
        setNearbyError(null);
        setNearbyGroups([]);
        if (!navigator.geolocation) {
          setNearbyError("Location access denied — use the Enter ID tab instead");
          setNearbyLoadingPhase(null);
          return;
        }
        setNearbyLoadingPhase("stops");
        navigator.geolocation.getCurrentPosition(
          (pos) => fetchNearby(pos.coords.latitude, pos.coords.longitude),
          () => {
            setNearbyError("Location access denied — use the Enter ID tab instead");
            setNearbyLoadingPhase(null);
            nearbyFetched.current = false;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };

      const retryNearby = () => {
        nearbyFetched.current = false;
        setNearbyError(null);
        onTabNearby();
      };

      const SEL_SEP = "\u0001";
      const toggleStop = (stop, group) => {
        const idClean = stop.idClean || (stop.id || "").replace(/^MTA_/i, "");
        const key = idClean + SEL_SEP + group.line + SEL_SEP + group.headsign;
        setSelectedKeys((prev) => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key);
          else next.add(key);
          return next;
        });
      };

      const addSelectedStops = () => {
        selectedKeys.forEach((key) => {
          const [idClean, line, headsign] = key.split(SEL_SEP);
          const group = nearbyGroups.find((g) => g.line === line && g.headsign === headsign);
          const stop = group?.stops?.find((s) => (s.idClean || (s.id || "").replace(/^MTA_/i, "")) === idClean);
          const label = (stop?.name || idClean).trim() || idClean;
          onAdd({ id: idClean, label });
        });
        close();
      };

      const cardContent = (
        <div
          style={{
            background: "var(--bg-card)",
            border: "1px solid var(--border-main)",
            borderRadius: "14px",
            maxWidth: "480px",
            width: "100%",
            maxHeight: "calc(100vh - 96px)",
            overflow: "hidden",
            display: "flex",
            flexDirection: "column",
            boxShadow: "0 4px 24px rgba(0,0,0,0.12)",
          }}
          onClick={(e) => e.stopPropagation()}
        >
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 18px", borderBottom: "1px solid var(--border-main)" }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "16px", fontWeight: 700, color: "var(--text-primary)" }}>Add Stop</div>
            <button onClick={close} style={{
              background: "none", border: "none", color: "var(--text-faint)", fontSize: "22px", cursor: "pointer",
              padding: "0 4px", lineHeight: 1, fontFamily: "'DM Mono', monospace",
            }}>×</button>
          </div>
          <div style={{ display: "flex", borderBottom: "1px solid var(--border-main)" }}>
            <button
              type="button"
              onClick={() => setTab("enterId")}
              style={{
                flex: 1, padding: "12px 16px", background: "none", border: "none",
                borderBottom: tab === "enterId" ? "2px solid var(--accent)" : "2px solid transparent",
                color: tab === "enterId" ? "var(--text-primary)" : "var(--text-muted)",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", fontWeight: 600, cursor: "pointer",
              }}
            >
              Enter ID
            </button>
            <button
              type="button"
              onClick={onTabNearby}
              style={{
                flex: 1, padding: "12px 16px", background: "none", border: "none",
                borderBottom: tab === "nearby" ? "2px solid var(--accent)" : "2px solid transparent",
                color: tab === "nearby" ? "var(--text-primary)" : "var(--text-muted)",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px", fontWeight: 600, cursor: "pointer",
              }}
            >
              Nearby
            </button>
          </div>
          <div style={{ padding: "18px", overflowY: "auto", flex: 1 }}>
            {tab === "enterId" && (
              <>
                <input
                  ref={inputRef}
                  type="text"
                  placeholder="Stop ID (e.g. 308829)"
                  value={id}
                  onChange={(e) => setId(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitEnterId()}
                  style={{
                    width: "100%", background: "var(--bg-input)", border: "1px solid var(--border-input)",
                    borderRadius: "8px", padding: "12px 14px", color: "var(--text-primary)",
                    fontFamily: "'DM Mono', monospace", fontSize: "14px", marginBottom: "12px",
                  }}
                />
                <input
                  type="text"
                  placeholder="e.g. Northbound on Court St"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && submitEnterId()}
                  style={{
                    width: "100%", background: "var(--bg-input)", border: "1px solid var(--border-input)",
                    borderRadius: "8px", padding: "12px 14px", color: "var(--text-primary)",
                    fontFamily: "'DM Sans', sans-serif", fontSize: "14px", marginBottom: "12px",
                  }}
                />
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "var(--text-muted)", marginBottom: "16px", lineHeight: 1.5 }}>
                  Find stop IDs at{" "}
                  <a href="https://bustime.mta.info" target="_blank" rel="noreferrer" style={{ color: "var(--text-secondary)", textDecoration: "underline" }}>bustime.mta.info</a>
                  {" "}→ click your stop → copy the ID from the URL.
                </div>
                <button onClick={submitEnterId} style={{
                  width: "100%", padding: "12px 18px", background: "var(--accent)", color: "var(--accent-btn-text)",
                  border: "none", borderRadius: "8px", fontFamily: "'DM Sans', sans-serif",
                  fontWeight: 700, fontSize: "14px", cursor: "pointer",
                }}>
                  Add Stop
                </button>
              </>
            )}
            {tab === "nearby" && (
              <>
                {nearbyLoadingPhase === "stops" && (
                  <div style={{ display: "flex", alignItems: "center", gap: "10px", padding: "20px 0", color: "var(--text-secondary)", fontFamily: "'DM Sans', sans-serif", fontSize: "14px" }}>
                    <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: "var(--text-faint)", animation: "blink 1s ease-in-out infinite" }} />
                    Finding nearby stops…
                  </div>
                )}
                {nearbyLoadingPhase === "arrivals" && (
                  <div style={{ display: "flex", alignItems: "center", gap: "10px", padding: "20px 0", color: "var(--text-secondary)", fontFamily: "'DM Sans', sans-serif", fontSize: "14px" }}>
                    <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: "var(--text-faint)", animation: "blink 1s ease-in-out infinite" }} />
                    Loading arrivals…
                  </div>
                )}
                {!nearbyLoadingPhase && nearbyError && (
                  <div style={{
                    padding: "12px 14px", background: "rgba(208,52,31,0.05)", border: "1px solid rgba(208,52,31,0.15)",
                    borderRadius: "8px", fontFamily: "'DM Sans', sans-serif", fontSize: "12px", color: "#C03A20", marginBottom: "12px",
                  }}>
                    {nearbyError}
                    {nearbyError.indexOf("connection") !== -1 && (
                      <span>{" "}<button type="button" onClick={retryNearby} style={{ background: "none", border: "none", color: "var(--accent)", textDecoration: "underline", cursor: "pointer", fontFamily: "inherit", fontSize: "inherit", padding: 0 }}>Retry</button></span>
                    )}
                  </div>
                )}
                {!nearbyLoadingPhase && !nearbyError && nearbyGroups.length > 0 && (
                  <div style={{ paddingBottom: selectedKeys.size > 0 ? "72px" : "0" }}>
                    {nearbyGroups.map((group) => {
                      const nearestDist = Math.min(...group.stops.map((s) => s.distanceM));
                      return (
                        <div key={group.line + "|" + group.headsign} style={{ marginBottom: "20px" }}>
                          <div style={{
                            display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px",
                            marginBottom: "8px", flexWrap: "wrap",
                          }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                              <span style={{
                                ...badgeStyle(), color: "var(--text-secondary)",
                              }}>{group.line}</span>
                              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "12px", color: "var(--text-secondary)" }}>→ {toTitleCase(group.headsign)}</span>
                            </div>
                            <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "var(--text-muted)", marginLeft: "auto" }}>{formatDistanceNearby(nearestDist)}</span>
                          </div>
                          {group.stops.map((stop) => {
                            const idClean = stop.idClean || (stop.id || "").replace(/^MTA_/i, "");
                            const key = idClean + SEL_SEP + group.line + SEL_SEP + group.headsign;
                            const selected = selectedKeys.has(key);
                            return (
                              <div
                                key={stop.id || idClean + group.line + group.headsign}
                                role="button"
                                tabIndex={0}
                                onClick={() => toggleStop(stop, group)}
                                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleStop(stop, group); } }}
                                style={{
                                  display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px",
                                  padding: "12px 14px", marginBottom: "6px",
                                  background: selected ? "var(--accent-muted-bg-light)" : "transparent",
                                  borderRadius: "8px", cursor: "pointer",
                                  border: "1px solid " + (selected ? "var(--accent-muted-border)" : "var(--border-main)"),
                                }}
                              >
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "14px", color: "var(--text-primary)", marginBottom: "2px" }}>{stop.name || "Stop " + idClean}</div>
                                  <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "var(--text-muted)" }}>{formatDistanceNearby(stop.distanceM)}</div>
                                </div>
                                <div style={{
                                  width: "20px", height: "20px", borderRadius: "4px", border: "2px solid " + (selected ? "var(--accent)" : "var(--text-faint)"),
                                  background: selected ? "var(--accent)" : "transparent",
                                  display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                                }}>
                                  {selected && <span style={{ color: "var(--accent-btn-text)", fontSize: "12px", fontWeight: 700 }}>✓</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                )}
                {!nearbyLoadingPhase && !nearbyError && nearbyGroups.length === 0 && (
                  <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "var(--text-muted)", padding: "16px 0" }}>
                    No active stops found nearby — try entering a Stop ID manually
                  </div>
                )}
              </>
            )}
          </div>
          {tab === "nearby" && selectedKeys.size > 0 && (
            <div style={{
              position: "sticky", bottom: 0, left: 0, right: 0,
              display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px",
              padding: "14px 18px", background: "var(--bg-modal-footer)", borderTop: "1px solid var(--border-main)",
            }}>
              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "var(--text-secondary)" }}>
                {selectedKeys.size} stop{selectedKeys.size !== 1 ? "s" : ""} selected
              </span>
              <button
                onClick={addSelectedStops}
                style={{
                  padding: "10px 18px", background: "var(--accent)", color: "var(--accent-btn-text)",
                  border: "none", borderRadius: "8px", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, fontSize: "14px", cursor: "pointer",
                }}
              >
                Add Stop(s)
              </button>
            </div>
          )}
        </div>
      );

      return (
        <div
          style={{
            position: "fixed", inset: 0, zIndex: 1000,
            background: "var(--bg-modal-overlay)",
            display: "flex", alignItems: "flex-start", justifyContent: "center",
            padding: "0 20px",
            animation: "modalIn 0.2s ease",
          }}
          onClick={close}
        >
          <div style={{ marginTop: "48px", width: "100%", maxWidth: "480px", marginLeft: "auto", marginRight: "auto" }}>
            {cardContent}
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [stops, setStops] = useState(() => {
        try { return JSON.parse(localStorage.getItem("mta-stops")) || []; }
        catch { return []; }
      });
      const [dataLastUpdated, setDataLastUpdated] = useState(null);
      const [mapData, setMapData] = useState(null); // { bus, fleet, stopId, line }
      const [addModalOpen, setAddModalOpen] = useState(false);
      const [theme, setTheme] = useState(() =>
        localStorage.getItem("mta-theme") || "default"
      );

      useEffect(() => {
        document.documentElement.setAttribute("data-theme",
          theme === "default" ? "" : theme
        );
        localStorage.setItem("mta-theme", theme);
      }, [theme]);
      const [trackedAlerts, setTrackedAlerts] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem("mta-alerts") || "[]");
          const now = Date.now();
          const future = stored.filter((key) => {
            const isoDate = key.substring(key.indexOf("_") + 1);
            const t = new Date(isoDate).getTime();
            return !isNaN(t) && t > now;
          });
          return new Set(future);
        } catch { return new Set(); }
      });

      useEffect(() => {
        try { localStorage.setItem("mta-alerts", JSON.stringify([...trackedAlerts])); } catch {}
      }, [trackedAlerts]);

      const addTrackedAlert = (key) => setTrackedAlerts((prev) => new Set([...prev, key]));
      const removeTrackedAlert = (key) => setTrackedAlerts((prev) => { const n = new Set(prev); n.delete(key); return n; });

      const saveStops  = (u) => { setStops(u); try { localStorage.setItem("mta-stops", JSON.stringify(u)); } catch {} };
      const addStop    = (s) => setStops((prev) => { const next = [...prev, s]; try { localStorage.setItem("mta-stops", JSON.stringify(next)); } catch {} return next; });
      const removeStop = (i) => saveStops(stops.filter((_, idx) => idx !== i));
      const renameStop = (index, newLabel) => {
        const updated = stops.map((s, i) => i === index ? { ...s, label: newLabel } : s);
        saveStops(updated);
      };

      return (
        <div style={{
          minHeight: "100vh", background: "var(--bg-app)", color: "var(--text-primary)",
          fontFamily: "'DM Sans', sans-serif",
          maxWidth: "480px", margin: "0 auto", padding: "32px 20px 60px",
        }}>
          {/* header */}
          <div style={{ marginBottom: "32px" }}>
            <div style={{
              fontFamily: "'DM Mono', monospace", fontSize: "10px",
              color: "var(--text-muted)", letterSpacing: "2.5px", textTransform: "uppercase", marginBottom: "6px",
            }}>NYC MTA</div>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: "4px" }}>
              <div style={{
                fontFamily: "'DM Sans', sans-serif", fontSize: "28px", fontWeight: 700,
                color: "var(--text-primary)", letterSpacing: "-0.5px", lineHeight: 1,
              }}>lowkey bus rider</div>
              <ThemeSwitcher theme={theme} onChange={setTheme} />
            </div>
            <div style={{
              display: "inline-flex", alignItems: "center", gap: "6px",
              fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "var(--text-muted)", marginTop: "8px",
              background: "var(--bg-status-pill)", border: "1px solid var(--border-status-pill)", borderRadius: "20px", padding: "4px 10px",
            }}>
              <span style={{ width: "5px", height: "5px", borderRadius: "50%", background: "#2E8A52", display: "inline-block" }} />
              beta · last updated {dataLastUpdated ? dataLastUpdated.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—"} · next 30 min
            </div>
          </div>

          <AddStopTrigger onClick={() => setAddModalOpen(true)} hasStops={stops.length > 0} />

          {addModalOpen && <AddStopModal onAdd={addStop} onClose={() => setAddModalOpen(false)} theme={theme} />}

          {stops.length === 0 ? (
            <div style={{
              padding: "32px 20px", textAlign: "center",
              fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "var(--text-muted)", lineHeight: 2,
            }}>
              No stops added yet.<br />Click &quot;+ Add Stop&quot; to get started.
            </div>
          ) : (
            stops.map((stop, i) => (
              <StopPanel
                key={stop.id + i}
                index={i}
                stopId={stop.id}
                label={stop.label}
                theme={theme}
                trackedAlerts={trackedAlerts}
                onAddTrackedAlert={addTrackedAlert}
                onRemoveTrackedAlert={removeTrackedAlert}
                onRemove={() => removeStop(i)}
                onRename={renameStop}
                onOpenMap={(bus, fleet, stopId, line) => setMapData({ bus, fleet, stopId, line })}
                onDataUpdated={(d) => setDataLastUpdated(d)}
              />
            ))
          )}

          <div style={{
            borderTop: "1px solid var(--border-divider)", paddingTop: "20px", marginTop: "12px",
            fontFamily: "'DM Mono', monospace", fontSize: "10px",
            color: "var(--text-muted)", textAlign: "center", letterSpacing: "1px",
          }}>AUTO-REFRESHES EVERY 30 SECONDS · MTA BUSTIME API · v{APP_VERSION}</div>

          {/* Map modal */}
          {mapData && <MapModal bus={mapData.bus} fleet={mapData.fleet} stopId={mapData.stopId} line={mapData.line} theme={theme} onClose={() => setMapData(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
