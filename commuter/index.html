<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lowkey Bus Rider - Beta</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; }
    @keyframes pulse {
      0%, 100% { background: rgba(255,255,255,0.04); }
      50%       { background: rgba(255,255,255,0.09); }
    }
    @keyframes urgentYellow {
      0%, 100% { background: rgba(245,200,35,0.08); }
      50%       { background: rgba(245,200,35,0.22); }
    }
    @keyframes urgentRed {
      0%, 100% { background: rgba(255,60,60,0.10); }
      50%       { background: rgba(255,60,60,0.28); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    input:focus { outline: none; border-color: #444 !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* Leaflet overrides for dark theme */
    .leaflet-container { background: #111 !important; font-family: 'DM Sans', sans-serif; }
    .leaflet-control-zoom a {
      background: #1a1a1a !important; color: #aaa !important;
      border-color: #2a2a2a !important;
    }
    .leaflet-control-zoom a:hover { background: #252525 !important; color: #fff !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.6) !important; color: #333 !important; font-size: 9px;
    }
    .leaflet-control-attribution a { color: #444 !important; }
    .bus-pin-label {
      background: transparent; border: none; box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ── config ──────────────────────────────────────────────── */
    const API_KEY = "5100a3c4-9704-43e4-b6d2-5d8adb10a124";
    const PROXY   = "https://mta-proxy-sundayontheroof.chief-b4a.workers.dev/?url=";

    const LINE_COLORS = {
      B57: "#F5A623", B69: "#4A90D9",
      B61: "#E05C5C", B62: "#7EC8A0", B63: "#C47FD4",
      B65: "#5BB8D4", B67: "#E8A05C", B68: "#8CA8E0",
    };
    function lineColor(line) { return LINE_COLORS[line] || "#888"; }

    /* ── helpers ─────────────────────────────────────────────── */
    function minutesUntil(iso) {
      return Math.round((new Date(iso) - new Date()) / 60000);
    }
    function getEls(el, tag) {
      if (!el) return [];
      const byNS = el.getElementsByTagNameNS("*", tag);
      return byNS.length > 0 ? byNS : el.getElementsByTagName(tag);
    }
    function xmlText(el, tag) {
      return getEls(el, tag)?.[0]?.textContent?.trim() || null;
    }
    function parseXML(xmlString) {
      let doc = new DOMParser().parseFromString(xmlString, "text/xml");
      if (doc.querySelector("parsererror"))
        doc = new DOMParser().parseFromString(xmlString, "application/xml");

      const visits = getEls(doc, "MonitoredStopVisit");
      return Array.from(visits).map((v) => {
        const mvj  = getEls(v, "MonitoredVehicleJourney")[0];
        const call = getEls(v, "MonitoredCall")[0];
        const dist = getEls(v, "Distances")[0];
        const loc  = getEls(mvj, "VehicleLocation")[0];
        const rawLine = xmlText(mvj, "PublishedLineName") || "";
        return {
          line:                rawLine.replace(/MTA NYCT_/i, "").trim(),
          destination:         xmlText(mvj,  "DestinationName") || rawLine,
          expectedArrival:     xmlText(call, "ExpectedArrivalTime"),
          aimedArrival:        xmlText(call, "AimedArrivalTime"),
          presentableDistance: xmlText(dist, "PresentableDistance"),
          stopsAway:           parseInt(xmlText(dist, "StopsFromCall"), 10) || null,
          vehicleLat:          loc ? parseFloat(xmlText(loc, "Latitude"))  : null,
          vehicleLng:          loc ? parseFloat(xmlText(loc, "Longitude")) : null,
        };
      });
    }

    /* ── MapModal ────────────────────────────────────────────── */
    function MapModal({ bus, fleet, stopId, line, onClose }) {
      const mapRef        = useRef(null);
      const leafletRef    = useRef(null);
      const userMarker    = useRef(null);
      const fleetMarkers  = useRef([]); // track all bus markers so we can remove on refresh
      const color         = lineColor(bus.line);
      const [refreshing,  setRefreshing]  = useState(false);
      const [lastRefresh, setLastRefresh] = useState(null);

      const GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 };

      // ── plot fleet markers (called on load + refresh) ──────────
      const plotFleet = useCallback((busArray, tappedBus) => {
        const map = leafletRef.current;
        if (!map) return;
        // Remove existing bus markers
        fleetMarkers.current.forEach(m => map.removeLayer(m));
        fleetMarkers.current = [];

        const busesWithCoords = busArray.filter(b => b.vehicleLat && b.vehicleLng);
        busesWithCoords.forEach((b) => {
          const isTapped = b.destination === tappedBus.destination && b.line === tappedBus.line;
          const opacity  = isTapped ? "1" : "0.5";
          const isoTime  = b.expectedArrival || b.aimedArrival;
          const mins     = isoTime ? minutesUntil(isoTime) : null;
          const timeLabel = mins === null || mins <= 0 ? "NOW" : mins + " min";
          const html = '<div style="display:flex;align-items:center;justify-content:center;background:' + color + ';color:#0a0a0a;font-family:DM Mono,monospace;font-weight:700;font-size:11px;padding:5px 8px;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,0.7);white-space:nowrap;position:relative;opacity:' + opacity + ';">' + b.line + '<div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid ' + color + ';"><\/div><\/div>';
          const icon = L.divIcon({ className: "bus-pin-label", html, iconSize: [52, 32], iconAnchor: [26, 38] });
          const marker = L.marker([b.vehicleLat, b.vehicleLng], { icon })
            .addTo(map)
            .bindPopup('<b style="font-family:DM Sans,sans-serif">' + b.line + ' \u2192 ' + b.destination + '<\/b><br><span style="font-family:DM Mono,monospace;font-size:12px;color:#F5A623">' + timeLabel + '<\/span>');
          fleetMarkers.current.push(marker);
        });
      }, [color]);

      // ── refresh: re-fetch MTA and re-plot ──────────────────────
      const refresh = useCallback(async () => {
        if (refreshing) return;
        setRefreshing(true);
        try {
          const raw = `https://bustime.mta.info/api/siri/stop-monitoring.xml`
            + `?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const res  = await fetch(PROXY + encodeURIComponent(raw));
          const text = await res.text();
          const allBuses   = parseXML(text);
          const freshFleet = allBuses.filter(b => b.line === line);
          plotFleet(freshFleet, bus);
          setLastRefresh(new Date());
        } catch (e) {
          console.error("Map refresh failed:", e);
        } finally {
          setRefreshing(false);
        }
      }, [refreshing, stopId, line, bus, plotFleet]);

      // Center map on user location
      const centerOnUser = useCallback(() => {
        if (!leafletRef.current) return;
        navigator.geolocation.getCurrentPosition((pos) => {
          leafletRef.current.setView([pos.coords.latitude, pos.coords.longitude], 17);
          if (userMarker.current) {
            userMarker.current.setLatLng([pos.coords.latitude, pos.coords.longitude]);
          }
        }, null, GEO_OPTS);
      }, []);

      useEffect(() => {
        // Init map
        const map = L.map(mapRef.current, {
          zoomControl: true,
          attributionControl: true,
        });
        leafletRef.current = map;

        // CartoDB Dark Matter tiles
        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ).addTo(map);

        // User location pin
        const userIcon = L.divIcon({
          className: "bus-pin-label",
          html: '<div style="width:16px;height:16px;border-radius:50%;background:#4A90D9;border:3px solid #fff;box-shadow:0 0 0 3px rgba(74,144,217,0.35),0 2px 8px rgba(0,0,0,0.6);"><\/div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8],
        });


        // Default center: NYC fallback
        let defaultCenter = [40.6782, -73.9442]; // Brooklyn

        // Plot initial fleet
        plotFleet(fleet || [bus], bus);

        // Request user location, center map on it at ~1 mile zoom (z=15)
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              defaultCenter = [latitude, longitude];
              map.setView(defaultCenter, 15);
              userMarker.current = L.marker([latitude, longitude], { icon: userIcon })
                .addTo(map)
                .bindPopup('<span style="font-family:DM Sans,sans-serif">You are here<\/span>');

              // Fit view between user and the tapped bus only (not all fleet)
              if (bus.vehicleLat && bus.vehicleLng) {
                const bounds = L.latLngBounds(
                  [latitude, longitude],
                  [bus.vehicleLat, bus.vehicleLng]
                );
                map.fitBounds(bounds, { padding: [80, 80], maxZoom: 17 });
              }
            },
            () => {
              // Geolocation denied or failed — center on bus or Brooklyn
              if (bus.vehicleLat && bus.vehicleLng) {
                map.setView([bus.vehicleLat, bus.vehicleLng], 15);
              } else {
                map.setView(defaultCenter, 14);
              }
            },
            GEO_OPTS
          );
        } else {
          map.setView(defaultCenter, 14);
        }

        // Close on Escape
        const handleKey = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handleKey);

        return () => {
          map.remove();
          window.removeEventListener("keydown", handleKey);
        };
      }, []);

      const isoTime  = bus.expectedArrival || bus.aimedArrival;
      const minutes  = isoTime ? minutesUntil(isoTime) : null;
      const timeLabel = minutes === null || minutes <= 0 ? "NOW" : `${minutes} min`;

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 1000,
          background: "rgba(0,0,0,0.92)",
          display: "flex", flexDirection: "column",
          animation: "modalIn 0.2s ease",
        }}>
          {/* Modal header */}
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "space-between",
            padding: "16px 20px",
            background: "#0d0d0d",
            borderBottom: "1px solid #1a1a1a",
            flexShrink: 0,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <div style={{
                background: color, color: "#0a0a0a",
                fontFamily: "'DM Mono', monospace", fontWeight: 700,
                fontSize: "13px", padding: "6px 10px", borderRadius: "6px",
              }}>{bus.line}</div>
              <div>
                <div style={{
                  fontFamily: "'DM Sans', sans-serif", fontSize: "13px",
                  color: "#999", textTransform: "uppercase", letterSpacing: "0.4px",
                }}>→ {bus.destination}</div>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontSize: "11px",
                  color: color, marginTop: "2px",
                }}>{timeLabel}</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              {/* Close button */}
              <button onClick={onClose} title="Close" style={{
                background: "transparent", border: "1px solid #2a2a2a",
                borderRadius: "8px", padding: "8px 12px",
                cursor: "pointer", color: "#555",
                fontFamily: "'DM Mono', monospace", fontSize: "18px", lineHeight: 1,
              }}>×</button>
            </div>
          </div>

          {/* No location warning if no bus coords */}
          {(fleet || [bus]).filter(b => b.vehicleLat && b.vehicleLng).length === 0 && (
            <div style={{
              background: "rgba(245,166,35,0.07)", borderBottom: "1px solid rgba(245,166,35,0.15)",
              padding: "10px 20px",
              fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#888",
              flexShrink: 0,
            }}>
              ⚠ Real-time bus location not yet available for this trip
            </div>
          )}

          {/* Map */}
          <div style={{ position: "relative", flex: 1 }}>
            <div ref={mapRef} style={{ width: "100%", height: "100%" }} />
            {/* Floating map controls */}
            <button
              onClick={centerOnUser}
              title="Center on my location"
              style={{
                position: "absolute", bottom: "80px", right: "16px", zIndex: 1000,
                width: "44px", height: "44px",
                background: "#0d0d0d", border: "1px solid #2a2a2a",
                borderRadius: "50%", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
              }}
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A90D9" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="22" y2="12"/>
              </svg>
            </button>
            <button
              onClick={refresh}
              title="Refresh bus locations"
              style={{
                position: "absolute", bottom: "24px", right: "16px", zIndex: 1000,
                width: "44px", height: "44px",
                background: "#0d0d0d", border: "1px solid #2a2a2a",
                borderRadius: "50%", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                boxShadow: "0 2px 12px rgba(0,0,0,0.6)",
              }}
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={refreshing ? "#555" : "#7EC8A0"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: refreshing ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.5s ease" }}>
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
            {lastRefresh && (
              <div style={{
                position: "absolute", bottom: "14px", right: "68px", zIndex: 1000,
                fontFamily: "'DM Mono', monospace", fontSize: "9px", color: "#333",
                background: "rgba(0,0,0,0.7)", padding: "3px 7px", borderRadius: "4px",
              }}>
                {lastRefresh.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── BusRow ──────────────────────────────────────────────── */
    function BusRow({ bus, onOpenMap }) {
      const color      = lineColor(bus.line);
      const isoTime    = bus.expectedArrival || bus.aimedArrival;
      const minutes    = isoTime ? minutesUntil(isoTime) : null;
      const isImminent = minutes === null || minutes <= 2;

      // Urgency levels
      const isRedAlert    = minutes !== null && minutes < 5;
      const isYellowAlert = minutes !== null && minutes >= 5 && minutes <= 10;

      const bgStyle = isRedAlert
        ? { animation: "urgentRed 0.8s ease-in-out infinite" }
        : isYellowAlert
        ? { animation: "urgentYellow 1.2s ease-in-out infinite" }
        : isImminent
        ? { animation: "pulse 1.5s ease-in-out infinite" }
        : { background: "rgba(255,255,255,0.025)", animation: "fadeIn 0.25s ease" };

      const borderColor = isRedAlert ? "#ff3c3c" : isYellowAlert ? "#f5c823" : color;

      return (
        <div
          onClick={() => onOpenMap(bus)}
          style={{
            display: "flex", alignItems: "center", gap: "14px",
            padding: "13px 16px",
            ...bgStyle,
            borderLeft: `3px solid ${borderColor}`,
            borderRadius: "2px 8px 8px 2px",
            marginBottom: "8px",
            cursor: "pointer",
            transition: "border-color 0.3s ease",
          }}
          onMouseEnter={(e) => e.currentTarget.style.filter = "brightness(1.15)"}
          onMouseLeave={(e) => e.currentTarget.style.filter = "brightness(1)"}
        >
          {/* line badge */}
          <div style={{
            background: color, color: "#0a0a0a",
            fontFamily: "'DM Mono', monospace", fontWeight: 700,
            fontSize: "12px", padding: "5px 9px", borderRadius: "5px",
            minWidth: "42px", textAlign: "center", flexShrink: 0, letterSpacing: "0.3px",
          }}>{bus.line || "?"}</div>

          {/* destination + distance */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px", color: "#999",
              textTransform: "uppercase", letterSpacing: "0.4px",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>→ {bus.destination}</div>
            {bus.presentableDistance && (
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#444", marginTop: "2px" }}>
                {bus.presentableDistance}{bus.stopsAway != null && !bus.presentableDistance?.toLowerCase().includes("stop") ? ` · ${bus.stopsAway} stop${bus.stopsAway !== 1 ? "s" : ""} away` : ""}
              </div>
            )}
          </div>

          {/* countdown + map hint */}
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            {minutes !== null ? (
              <>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontWeight: 700,
                  fontSize: "24px", lineHeight: 1,
                  color: isRedAlert ? "#ff3c3c" : isYellowAlert ? "#f5c823" : isImminent ? color : "#e8e8e8",
                }}>{minutes <= 0 ? "NOW" : minutes}</div>
                {minutes > 0 && <div style={{ fontSize: "10px", color: "#444", fontFamily: "'DM Sans', sans-serif", marginTop: "2px" }}>min</div>}
              </>
            ) : (
              <div style={{
                fontFamily: "'DM Mono', monospace", fontWeight: 700,
                fontSize: "24px", lineHeight: 1, color,
              }}>NOW</div>
            )}
            <div style={{ fontSize: "9px", color: "#2e2e2e", fontFamily: "'DM Mono', monospace", marginTop: "4px", letterSpacing: "0.5px" }}></div>
          </div>
        </div>
      );
    }

    /* ── StopPanel ───────────────────────────────────────────── */
    function StopPanel({ stopId, label, onRemove, onOpenMap }) {
      const [buses,       setBuses]       = useState([]);
      const [loading,     setLoading]     = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [fetchError,  setFetchError]  = useState(null);

      const fetchData = useCallback(async () => {
        if (!stopId) return;
        setLoading(true);
        setFetchError(null);
        try {
          const raw = `https://bustime.mta.info/api/siri/stop-monitoring.xml`
            + `?key=${API_KEY}&OperatorRef=MTA&MonitoringRef=${stopId}&MaximumStopVisits=20`;
          const res  = await fetch(PROXY + encodeURIComponent(raw));
          const text = await res.text();
          setBuses(parseXML(text));
          setLastUpdated(new Date());
        } catch (e) {
          setFetchError(e.message);
        } finally {
          setLoading(false);
        }
      }, [stopId]);

      useEffect(() => {
        fetchData();
        const t = setInterval(fetchData, 30000);
        return () => clearInterval(t);
      }, [fetchData]);

      const visible = buses.filter((b) => {
        const iso = b.expectedArrival || b.aimedArrival;
        if (!iso) return true;
        const m = minutesUntil(iso);
        return m >= -1 && m <= 30;
      });

      return (
        <div style={{ marginBottom: "28px", animation: "fadeIn 0.3s ease" }}>
          {/* stop header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "13px", color: "#e8e8e8", fontWeight: 600 }}>
                Stop <span style={{ color: "#F5A623" }}>{stopId}</span>
              </div>
              {label && (
                <div style={{
                  fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
                  color: "#444", textTransform: "uppercase", letterSpacing: "0.8px",
                }}>{label}</div>
              )}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              {lastUpdated && (
                <span style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#2e2e2e" }}>
                  {lastUpdated.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </span>
              )}
              {loading && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#333", animation: "blink 1s ease-in-out infinite" }} />}
              <button onClick={onRemove} title="Remove stop" style={{
                background: "transparent", border: "none", cursor: "pointer",
                color: "#2e2e2e", fontSize: "18px", lineHeight: 1,
                padding: "2px 4px", fontFamily: "'DM Mono', monospace",
              }}>×</button>
            </div>
          </div>

          <div style={{ height: "1px", background: "linear-gradient(to right, #1e1e1e, transparent)", marginBottom: "12px" }} />

          {fetchError ? (
            <div style={{
              padding: "14px", background: "rgba(255,80,80,0.06)",
              border: "1px solid rgba(255,80,80,0.15)", borderRadius: "8px",
              fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#ff5050",
            }}>Error: {fetchError}</div>
          ) : visible.length === 0 ? (
            <div style={{
              padding: "18px", background: "rgba(255,255,255,0.02)",
              border: "1px dashed #1a1a1a", borderRadius: "8px",
              textAlign: "center", color: "#2e2e2e",
              fontFamily: "'DM Mono', monospace", fontSize: "12px",
            }}>{loading ? "Loading…" : "No buses within 30 min"}</div>
          ) : (
            visible.map((bus, i) => (
              <BusRow key={i} bus={bus} onOpenMap={(tapped) => onOpenMap(tapped, visible.filter(b => b.line === tapped.line), stopId, tapped.line)} />
            ))
          )}
        </div>
      );
    }

    /* ── AddStopForm ─────────────────────────────────────────── */
    function AddStopForm({ onAdd }) {
      const [id,    setId]    = useState("");
      const [label, setLabel] = useState("");
      const inputRef = useRef();

      const submit = () => {
        const trimmed = id.trim();
        if (!trimmed) return;
        onAdd({ id: trimmed, label: label.trim() });
        setId(""); setLabel("");
        inputRef.current?.focus();
      };

      return (
        <div style={{
          background: "rgba(255,255,255,0.02)", border: "1px solid #1a1a1a",
          borderRadius: "10px", padding: "18px 20px", marginBottom: "32px",
        }}>
          <div style={{
            fontFamily: "'DM Sans', sans-serif", fontSize: "11px", fontWeight: 600,
            color: "#444", textTransform: "uppercase", letterSpacing: "1.2px", marginBottom: "14px",
          }}>Add a Bus Stop</div>
          <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
            <input ref={inputRef} type="text" placeholder="Stop ID  (e.g. 308829)"
              value={id} onChange={(e) => setId(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}
              style={{
                flex: "1 1 130px", background: "#0d0d0d", border: "1px solid #222",
                borderRadius: "7px", padding: "10px 12px", color: "#ccc",
                fontFamily: "'DM Mono', monospace", fontSize: "13px",
              }} />
            <input type="text" placeholder="Label  (optional, e.g. Northbound)"
              value={label} onChange={(e) => setLabel(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}
              style={{
                flex: "2 1 180px", background: "#0d0d0d", border: "1px solid #222",
                borderRadius: "7px", padding: "10px 12px", color: "#ccc",
                fontFamily: "'DM Sans', sans-serif", fontSize: "13px",
              }} />
            <button onClick={submit} style={{
              flexShrink: 0, padding: "10px 20px", background: "#F5A623", color: "#0a0a0a",
              border: "none", borderRadius: "7px", fontFamily: "'DM Sans', sans-serif",
              fontWeight: 700, fontSize: "13px", cursor: "pointer",
            }}>+ Add</button>
          </div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif", fontSize: "11px", color: "#2e2e2e",
            marginTop: "10px", lineHeight: 1.6,
          }}>
            Find stop IDs at{" "}
            <a href="https://bustime.mta.info" target="_blank" rel="noreferrer"
              style={{ color: "#3a3a3a", textDecoration: "underline" }}>bustime.mta.info</a>
            {" "}→ click your stop → copy the ID from the URL. Each direction is a separate stop ID.
          </div>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────── */
    function App() {
      const [stops, setStops] = useState(() => {
        try { return JSON.parse(localStorage.getItem("mta-stops")) || []; }
        catch { return []; }
      });
      const [now,       setNow]       = useState(new Date());
      const [mapData, setMapData] = useState(null); // { bus, fleet, stopId, line }

      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 10000);
        return () => clearInterval(t);
      }, []);

      const saveStops  = (u) => { setStops(u); try { localStorage.setItem("mta-stops", JSON.stringify(u)); } catch {} };
      const addStop    = (s) => saveStops([...stops, s]);
      const removeStop = (i) => saveStops(stops.filter((_, idx) => idx !== i));

      return (
        <div style={{
          minHeight: "100vh", background: "#080808", color: "#e8e8e8",
          fontFamily: "'DM Sans', sans-serif",
          maxWidth: "480px", margin: "0 auto", padding: "32px 20px 60px",
        }}>
          {/* header */}
          <div style={{ marginBottom: "32px" }}>
            <div style={{
              fontFamily: "'DM Mono', monospace", fontSize: "10px",
              color: "#2e2e2e", letterSpacing: "2.5px", textTransform: "uppercase", marginBottom: "6px",
            }}>NYC MTA</div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "28px", fontWeight: 700,
              color: "#e8e8e8", letterSpacing: "-0.5px", lineHeight: 1,
            }}>Lowkey Bus Rider</div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#2e2e2e", marginTop: "6px" }}>
              beta · {now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · next 30 min
            </div>
          </div>

          <AddStopForm onAdd={addStop} />

          {stops.length === 0 ? (
            <div style={{
              padding: "32px 20px", textAlign: "center",
              fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#222", lineHeight: 2,
            }}>
              No stops added yet.<br />Enter a stop ID above to get started.
            </div>
          ) : (
            stops.map((stop, i) => (
              <StopPanel
                key={stop.id + i}
                stopId={stop.id}
                label={stop.label}
                onRemove={() => removeStop(i)}
                onOpenMap={(bus, fleet, stopId, line) => setMapData({ bus, fleet, stopId, line })}
              />
            ))
          )}

          <div style={{
            borderTop: "1px solid #111", paddingTop: "20px", marginTop: "12px",
            fontFamily: "'DM Mono', monospace", fontSize: "10px",
            color: "#1e1e1e", textAlign: "center", letterSpacing: "1px",
          }}>AUTO-REFRESHES EVERY 30 SECONDS · MTA BUSTIME API · v1.2.0</div>

          {/* Map modal */}
          {mapData && <MapModal bus={mapData.bus} fleet={mapData.fleet} stopId={mapData.stopId} line={mapData.line} onClose={() => setMapData(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
